<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>식이 질문·목표 화면 설계서 v1.0.0</title>
<style>
:root{--font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;--ink-1:#16233f;--ink-2:#5a6880;--ink-3:#98a4b8;--line:#e9edf5;--page:#f4f6fa;--fill:#f5f7fb;--brand:#2f6bff;--brand-soft:#eff4ff;--ok:#12a150;--warn:#e5893a;--alert:#f43f5e;--meal:#e5893a;--meal-soft:#fff4e8;--r:20px;--r-in:14px;--sh:0 1px 2px rgba(22,35,63,.04),0 8px 24px rgba(22,35,63,.04);--map:#f59e0b;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);font-size:14px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;background:#e8ebf2;color:var(--ink-1);-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;letter-spacing:inherit}[hidden]{display:none!important}
.page{max-width:1240px;margin:0 auto;padding:26px 20px 48px}.top h1{font-size:21px;font-weight:800;letter-spacing:-.02em}.top p{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.65}.top code{font-family:var(--mono);font-size:11.5px;background:#fff;border:1px solid var(--line);padding:1px 6px;border-radius:6px}.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0 20px;padding:12px 14px;background:#fff;border-radius:16px;box-shadow:var(--sh)}.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ctl>span{font-size:12px;font-weight:700;color:var(--ink-3);margin-right:2px}.seg{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--fill);border:1px solid var(--line)}.seg.on{background:var(--brand);border-color:var(--brand);color:#fff}.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none}.toggle input{accent-color:var(--map);width:16px;height:16px}.stage{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.phone{width:400px;max-width:100%;height:820px;border-radius:46px;background:#10151f;padding:10px;box-shadow:0 24px 60px rgba(22,35,63,.2);position:sticky;top:16px}.app{width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--page);position:relative;display:flex;flex-direction:column}.sbar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:14px;font-weight:700;background:var(--page)}.sbar i{font-style:normal;letter-spacing:2px;font-size:10px}.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.app-h{display:flex;align-items:center;padding:12px 18px;background:var(--page)}.app-h b{font-size:22px;font-weight:800}.app-b{padding:14px 18px 30px}.hero{padding:10px 2px 2px}.hero small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}.hero h2{font-size:24px;line-height:1.35;letter-spacing:-.03em;margin-top:4px}.qcard{background:#fff;border-radius:var(--r);padding:20px;margin-top:18px;box-shadow:var(--sh)}.qkind{font-size:12px;font-weight:700;color:var(--meal)}.qcard h3{font-size:20px;line-height:1.45;margin:13px 0 16px}.hint{font-size:12px;line-height:1.55;color:var(--ink-2);background:var(--fill);border-radius:10px;padding:10px 12px;margin:-5px 0 14px}.opts{display:flex;flex-direction:column;gap:9px}.opt{min-height:52px;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:14px;font-weight:650}.opt:after{content:'';width:18px;height:18px;border:1.5px solid #c9d1df;border-radius:50%;flex:none}.opt.on{border-color:var(--brand);background:var(--brand-soft);color:#244dbd}.opt.on:after{border:5px solid var(--brand)}.cta{width:100%;height:52px;border-radius:14px;background:var(--brand);color:#fff;font-size:15px;font-weight:750;margin-top:14px}.cta:disabled{background:#d7dce6;color:#929bab;cursor:not-allowed}.goal{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-top:18px;border-top:4px solid var(--meal)}.goal .meta{font-size:12px;font-weight:700;color:var(--meal)}.goal h3{font-size:22px;line-height:1.42;margin-top:12px}.goal .done{width:100%;height:50px;border-radius:14px;background:var(--meal-soft);color:#a65c13;font-size:14px;font-weight:750;margin-top:22px}.goal .done.on{background:#e8f7ee;color:var(--ok)}.note{margin-top:14px;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:12.5px;line-height:1.65;color:var(--ink-2)}.empty{text-align:center;padding:70px 14px 0}.empty i{font-style:normal;font-size:56px}.empty h2{font-size:20px;margin-top:16px}.empty p{font-size:13px;line-height:1.65;color:var(--ink-2);margin-top:8px}.nav{height:66px;flex:none;display:flex;justify-content:space-around;align-items:center;background:#fff;border-top:1px solid var(--line)}.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;color:#b6c0d1}.nav span{font-size:17px;line-height:1}.nav small{font-size:11px;font-weight:600;line-height:1}.nav .on{color:var(--brand)}.toast{position:absolute;left:16px;right:16px;bottom:86px;background:rgba(22,35,63,.93);color:#fff;padding:13px 16px;border-radius:14px;text-align:center;font-size:13px;font-weight:650;z-index:30}
.side{background:#fff;border-radius:20px;box-shadow:var(--sh);overflow:hidden}.side-h{padding:18px 22px 14px;border-bottom:1px solid var(--line)}.side-h .step{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand)}.side-h .id{display:inline-block;font-size:10.5px;color:var(--ink-2);background:var(--fill);border:1px solid var(--line);padding:1px 7px;border-radius:6px;margin-left:6px}.side-h h2{font-size:18px;font-weight:800;margin-top:5px}.side-h p{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.65}.side-b{padding:14px 22px 24px;overflow-x:auto}.spec-h{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.02em;margin:0 0 10px}.spec-h.sep{margin-top:22px;padding-top:16px;border-top:2px solid var(--line)}dl.spec{margin:0}.spec dt{font-size:13.5px;font-weight:800;padding-top:12px}.spec dt:first-child{padding-top:0}.spec dd{margin:4px 0 0;padding-bottom:12px;border-bottom:1px solid #f1f3f8;font-size:13px;line-height:1.7;color:var(--ink-2)}.spec dd:last-child{border-bottom:0}.spec code{font-family:var(--mono);font-size:11.5px;background:var(--fill);padding:1px 5px;border-radius:4px;color:#1e3a8a}.fm{width:100%;border-collapse:collapse;font-size:12px}.fm th,.fm td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:88px}.fm th{font-size:11px;color:var(--ink-3);background:var(--fill);font-weight:700}.fm td:first-child{font-weight:700;color:var(--ink-1)}.fm td{color:var(--ink-2)}.rule{padding:13px 14px;border-radius:12px;background:var(--brand-soft);font-size:12.5px;line-height:1.65;color:#334b89}.rule.warn{background:#fff6e8;color:#875314}.mini{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 6px}body.map [data-f]{outline:1.5px dashed var(--map);outline-offset:2px;position:relative}body.map [data-f]::after{content:attr(data-f);position:absolute;top:-10px;right:-2px;background:var(--map);color:#fff;font:600 9.5px/1 var(--mono);padding:3px 5px;border-radius:4px;white-space:nowrap;z-index:5}.axis-wrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px}.axis-wrap .fm th{position:sticky;top:0;z-index:2}.done-banner{display:flex;align-items:center;gap:10px;background:#e8f7ee;color:#087f5b;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px;font-weight:700}
.ov-title{font-size:22px;font-weight:800;line-height:1.35;margin:4px 0 16px}.ov-flow{display:flex;flex-direction:column;gap:8px}.ov-step{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:13px 14px;box-shadow:var(--sh)}.ov-step>span{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}.ov-step b{display:block;font-size:14px}.ov-step small{display:block;color:var(--ink-3);font-size:11px;margin-top:1px}.ov-arrow{text-align:center;color:#b0bac9;font-size:14px;line-height:1}.ov-rule{margin-top:14px;border-radius:14px;background:var(--meal-soft);padding:13px 14px;font-size:12px;line-height:1.65;color:#8b551c}
.term-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.term{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fbfcfe}.term b{display:block;font:700 11px var(--mono);color:var(--brand)}.term span{display:block;margin-top:3px;font-size:12px;line-height:1.55;color:var(--ink-2)}.dev-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}.dev-row{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--line)}.dev-row:last-child{border-bottom:0}.dev-row b{padding:10px 11px;background:var(--fill);font-size:12px}.dev-row span{padding:10px 12px;font-size:12.5px;line-height:1.65;color:var(--ink-2)}.edge-list{list-style:none}.edge-list li{padding:9px 0 9px 20px;border-bottom:1px solid #f1f3f8;font-size:12.5px;line-height:1.65;color:var(--ink-2);position:relative}.edge-list li:last-child{border-bottom:0}.edge-list li:before{content:'!';position:absolute;left:0;top:10px;width:15px;height:15px;border-radius:50%;background:#fff0e6;color:#c65f00;font:800 10px/15px var(--mono);text-align:center}.example{border:1px solid #cdd9ff;background:#f6f8ff;border-radius:12px;padding:13px 14px;font-size:12.5px;line-height:1.75;color:#334b89}.example b{color:#213d98}.code{font-family:var(--mono);font-size:11px;background:#101827;color:#e8edf7;border-radius:10px;padding:11px 12px;line-height:1.65;overflow:auto;white-space:pre-wrap}
@media(max-width:920px){.stage{grid-template-columns:1fr}.phone{margin:0 auto;position:relative;top:0;height:780px}}@media(max-width:520px){.page{padding:14px 10px 34px}.phone{width:100%;border-radius:38px}.controls{gap:8px}.seg{font-size:11.5px;padding:5px 9px}.side-b{padding:14px}.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>식이 질문·목표 화면 설계서</h1>
    <p>홈의 오늘 질문에서 시작해 식이 목표가 생성되는 화면 흐름을 정의함. 왼쪽 화면은 직접 조작 가능하며, 오른쪽에 선택한 화면의 동작과 표시 정보를 기재함. 화면 내 데이터는 모두 가상임. <b>v1.0.0</b></p>
  </div>
  <div class="controls">
    <div class="ctl" id="jump"></div>
    <div class="ctl" id="scen"></div>
    <label class="toggle"><input type="checkbox" id="mapT"> 정보 위치 표시</label>
  </div>
  <div class="stage">
    <div class="phone"><div class="app">
      <div class="sbar"><span>9:41</span><i>●●● ▮</i></div>
      <div id="screen" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
      <div id="toast"></div>
    </div></div>
    <aside class="side">
      <div class="side-h"><div class="step" id="sStep"></div><h2 id="sTitle"></h2><p id="sDesc"></p></div>
      <div class="side-b" id="sBody"></div>
    </aside>
  </div>
</div>
<script>
const S={screen:'overview',scen:'normal',selected:null,completed:false,tt:null};
const NAV=`<nav class="nav"><div class="on"><span>⌂</span><small>홈</small></div><div><span>♡</span><small>생활</small></div><div><span>✚</span><small>병원</small></div><div><span>•••</span><small>더보기</small></div></nav>`;
const LABEL={normal:'일반',skip:'결식',clinic:'지방간 진료정보',multi:'당뇨+이상지질',night:'저녁 식후',none:'후보 없음'};
const SCEN_FOR={overview:['normal'],fixed:['normal','skip','night'],clinic:['clinic'],rotation:['normal','multi'],goal:['normal','skip','multi'],after:['night'],guidance:['none']};
function shell(inner){return `<div class="app-h"><b>오늘의 질문</b></div><div class="scroll" id="sc"><div class="app-b">${inner}</div></div>${NAV}`}
function question({kind='식이',title,opts,button='다음',hint=''}){
  return shell(`<section class="qcard" style="margin-top:4px"><div class="qkind">${kind}</div><h3 data-f="질문 문구">${title}</h3>${hint?`<div class="hint" data-f="질문 출처">${hint}</div>`:''}<div class="opts" data-f="답변 선택지">${opts.map((o,i)=>`<button class="opt ${S.selected===i?'on':''}" onclick="pick(${i})">${o}</button>`).join('')}</div><button class="cta" ${S.selected===null?'disabled':''} onclick="next()">${button}</button></section>`)}
const SCREENS={
  overview(){return `<div class="app-h"><b>식이 질문 · 목표</b></div><div class="scroll" id="sc"><div class="app-b"><div class="ov-title">오늘의 답변이<br>목표가 되기까지</div><div class="ov-flow"><div class="ov-step"><span>1</span><div><b>앱 진입</b><small>시각으로 질문할 끼니 결정</small></div></div><div class="ov-arrow">↓</div><div class="ov-step"><span>2</span><div><b>질문 최대 2개</b><small>공통·질환 확인·회전 질문</small></div></div><div class="ov-arrow">↓</div><div class="ov-step"><span>3</span><div><b>답변 저장</b><small>지난 끼니와 질문별 현재 답 기록</small></div></div><div class="ov-arrow">↓</div><div class="ov-step"><span>4</span><div><b>목표 후보 계산</b><small>질환 안전·시간·달력 조건 적용</small></div></div><div class="ov-arrow">↓</div><div class="ov-step"><span>5</span><div><b>식이 목표 최대 1개</b><small>최근에 보지 않은 문구 우선</small></div></div></div></div></div>${NAV}`},
  fixed(){const meal=S.scen==='night'?'오늘 저녁':S.scen==='skip'?'오늘 점심':'어제 저녁';return question({title:`${meal}은<br>평소만큼 드셨나요?`,opts:['평소대로','조금 적게','거의 못 먹거나 거름']})},
  clinic(){return question({kind:'진료정보 확인',title:'지방간을 현재<br>관리하고 계신가요?',hint:'연동된 진료정보에 기록이 있어 확인합니다.',opts:['현재 관리 중이에요','아니요','잘 모르겠어요']})},
  rotation(){const multi=S.scen==='multi';return question({title:multi?'어제 저녁에 튀김이나<br>기름진 반찬이 있었나요?':'어제 저녁에 채소<br>반찬이 있었나요?',opts:multi?['안 먹었어요','맛만 봤어요','먹었어요']:['두 가지 이상','한 가지','먹지 않았어요'],button:'답변 완료'})},
  goal(){let title='한 끼는 채소 반찬 한 가지',meta='🍚 식이 · 오늘 아침';if(S.scen==='skip'){title='부담 없는 한 끼부터 챙기기';meta='🍚 식이 · 다음 끼니'}if(S.scen==='multi'){title='튀김 대신 굽거나 찐 반찬 고르기';meta='🍚 식이 · 오늘 저녁'}return `<div class="app-h"><b>오늘의 목표</b></div><div class="scroll" id="sc"><div class="app-b"><div class="hero"><small>답변을 반영했어요</small><h2>오늘 실천할 목표를<br>정했어요</h2></div><section class="goal" data-f="식이 목표"><div class="meta" data-f="대상 끼니">${meta}</div><h3 data-f="목표 문구">${title}</h3><button class="done ${S.completed?'on':''}" onclick="completeGoal()">${S.completed?'완료했어요 ✓':'완료했어요'}</button></section>${S.completed?`<div class="done-banner">✓ 오늘 목표를 완료했어요</div>`:''}</div></div>${NAV}`},
  after(){return `<div class="app-h"><b>오늘의 목표</b></div><div class="scroll" id="sc"><div class="app-b"><div class="hero"><small>저녁 답변을 반영했어요</small><h2>오늘 밤에 할 수 있는<br>작은 준비예요</h2></div><section class="goal" data-f="식후 목표"><div class="meta">🍚 식이 · 오늘 밤</div><h3 data-f="목표 문구">내일 아침 먹을 자리<br>치워 두기</h3><button class="done ${S.completed?'on':''}" onclick="completeGoal()">${S.completed?'완료했어요 ✓':'완료했어요'}</button></section><div class="note">자정이 지나면 날짜 표현이 맞는 목표만 사용합니다.</div></div></div>${NAV}`},
  guidance(){return `<div class="app-h"><b>오늘의 목표</b></div><div class="scroll" id="sc"><div class="empty" data-f="안내 상태"><i>📋</i><h2>개인 식사 계획을<br>확인해 주세요</h2><p>현재 조건에 맞는 공통 식이 목표가 없어<br>오늘은 안내만 확인해 주세요.</p></div></div>${NAV}`}
};

  const info=`<div class="spec-h sep">${S.screen==='overview'?'핵심 기준':'표시 정보'}</div><table class="fm"><tr><th>항목</th><th>출처</th><th>표시 기준</th></tr>${s.info.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table>`;
  let extra='';
  if(S.screen==='overview')extra=`
    <div class="spec-h sep">용어 정의</div>
    <div class="term-grid">
      <div class="term"><b>하루 기준</b><span>하루의 질문과 목표를 묶는 기준입니다. 00~04시는 전날 식이 기록과 같은 하루로 봅니다.</span></div>
      <div class="term"><b>질문할 끼니</b><span>사용자가 실제로 떠올려 답할 아침·점심·저녁입니다.</span></div>
      <div class="term"><b>고정 질문</b><span>지난 끼니를 평소만큼 먹었는지 묻는 공통 첫 질문입니다.</span></div>
      <div class="term"><b>회전 질문</b><span>7개 행동 축 중 하루 하나를 골라 두 번째로 묻는 질문입니다.</span></div>
      <div class="term"><b>식습관 상태</b><span>최근 답으로 계산한 관찰 중·개선 필요·보통·양호입니다. 사용자 화면에는 표시하지 않습니다.</span></div>
      <div class="term"><b>목표 난이도</b><span>사용자가 실천하기 쉬운 정도에 따라 입문·기본·도전으로 나눕니다.</span></div>
      <div class="term"><b>행동 목표</b><span>사용자가 실제로 보고 실천할 식이 목표가 정해진 상태입니다.</span></div>
      <div class="term"><b>안내 상태</b><span>현재 조건에 맞는 안전한 목표가 없어 안내만 보여주는 상태입니다.</span></div>
    </div>
    <div class="spec-h sep">목표 선정 우선순위</div><div class="rule">회복 → 내정보 직접 선택 질환 → 사용자 확인을 마친 진료 질환 → 3개월 이내 건강검진 신호 → 연동 수면 5시간 미만 → 일반 식이 축</div>
    <div class="spec-h sep">한 번의 실제 처리 예시</div>
    <div class="example"><b>9월 29일 오전 8시 20분 · 일반 사용자</b><br>① <b>어제 저녁</b>을 질문할 끼니로 결정합니다.<br>② 공통 질문에 「평소대로」를 저장합니다.<br>③ 질환·검진 연결이 없으므로 최근 28일 답이 가장 적은 <b>채소 축</b>을 회전 질문으로 고릅니다.<br>④ 「한 가지」 답을 저장합니다.<br>⑤ 안전·시간·달력 조건을 통과한 목표 가운데 최근 30일에 나오지 않은 문구를 골라 <b>「한 끼는 채소 반찬 한 가지」</b>를 오늘 아침 목표로 저장합니다.</div>
    `;
  if(S.screen==='rotation')extra=`<div class="spec-h sep">8개 식이 축 · 질문과 3개 답변</div><div class="axis-wrap"><table class="fm"><tr><th>축</th><th>질문</th><th>답변 3개</th></tr>${AXES.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div>`;
  if(S.screen==='goal')extra=`<div class="spec-h sep">목표 선정 우선순위</div><div class="rule">회복 → 내정보 직접 선택 질환 → 사용자 확인을 마친 진료 질환 → 3개월 이내 건강검진 신호 → 연동 수면 5시간 미만 → 일반 식이 축</div>`;
  if(S.screen==='fixed')extra=`<div class="spec-h sep">끼니 시간 경계</div><div class="rule">04~10시 어제 저녁 · 10~12시 오늘 아침 · 12~17시 오늘 점심 · 17~24시 오늘 저녁 · 00~04시 어제 저녁</div>`;
  const edge=`<div class="spec-h sep">예외·주의</div><ul class="edge-list">${EDGE[S.screen].map(x=>`<li>${x}</li>`).join('')}</ul>`;
  sBody.innerHTML=spec+info+extra+edge;
}
const JUMP=[['overview','⓪ 구조 안내'],['fixed','① 공통 질문'],['clinic','① 질환 확인'],['rotation','② 회전 질문'],['goal','③ 목표'],['after','③ 식후 목표'],['guidance','③ 안내 상태']];
function setScreen(k){S.screen=k;S.selected=null;S.completed=false;const allowed=SCEN_FOR[k];if(!allowed.includes(S.scen))S.scen=allowed[0];render()}
function setScen(k){S.scen=k;S.selected=null;S.completed=false;render()}
function pick(i){S.selected=i;render()}
function next(){if(S.selected===null)return;if(S.screen==='fixed'){if(S.selected===2){S.scen='skip';setScreen('goal')}else setScreen('rotation')}else if(S.screen==='clinic'){if(S.selected===0)setScreen('rotation');else setScreen('fixed')}else if(S.screen==='rotation')setScreen('goal')}
function completeGoal(){S.completed=!S.completed;render();if(S.completed)toast('완료로 기록했어요')}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=`<div class="toast">${msg}</div>`;clearTimeout(S.tt);S.tt=setTimeout(()=>t.innerHTML='',2200)}
function render(){const screenEl=document.getElementById('screen'),jumpEl=document.getElementById('jump'),scenEl=document.getElementById('scen');screenEl.innerHTML=SCREENS[S.screen]();jumpEl.innerHTML='<span>화면</span>'+JUMP.map(([k,t])=>`<button class="seg ${S.screen===k?'on':''}" onclick="setScreen('${k}')">${t}</button>`).join('');const allowed=SCEN_FOR[S.screen];scenEl.innerHTML='<span>데이터 상황</span>'+allowed.map(k=>`<button class="seg ${S.scen===k?'on':''}" onclick="setScen('${k}')">${LABEL[k]}</button>`).join('');scenEl.style.display=allowed.length>1?'':'none';renderSide();const sc=document.getElementById('sc');if(sc)sc.scrollTop=0}
document.getElementById('mapT').onchange=e=>document.body.classList.toggle('map',e.target.checked);render();
</script>
</body>
