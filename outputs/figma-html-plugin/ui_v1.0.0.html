<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
:root{--ink:#1A2233;--ink2:#5A6880;--ink3:#98A4B8;--line:#E3E8F2;--fill:#F5F7FB;--brand:#2F66F5;--alert:#E8365D}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font:12px/1.5 Inter,'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.grp{display:flex;align-items:center;gap:6px}
.grp>b{font-weight:700;color:var(--ink2);white-space:nowrap}
.ver{font-size:11px;font-weight:700;color:var(--brand);background:#EEF3FF;border-radius:6px;padding:2px 7px}
input[type=text],select{height:28px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:#fff;outline:none}
input[type=text]:focus,select:focus{border-color:var(--brand)}
#url{width:300px}#sel{width:110px}#label{width:160px}
.btn{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:disabled{opacity:.45;cursor:default}
label.ck{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.stage{flex:1;min-height:0;position:relative;background:#E8EBF2;overflow:hidden}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#view{border:0;display:block;background:#fff}
.drop{position:absolute;inset:16px;border:2px dashed #C3CCDD;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink2);background:rgba(255,255,255,.7)}
.drop b{font-size:15px;color:var(--ink)}
.drop.on{border-color:var(--brand);background:#EEF3FF}
.status{padding:6px 12px;border-top:1px solid var(--line);color:var(--ink2);min-height:28px;display:flex;align-items:center;gap:8px}
.status.err{color:var(--alert)}
.hint{color:var(--ink3)}
/* 창 크기 조절 손잡이(오른쪽 아래) */
#grip{position:fixed;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:20;
  background:linear-gradient(135deg,transparent 0 55%,#B6C0D1 55% 62%,transparent 62% 72%,#B6C0D1 72% 79%,transparent 79%)}
#shield{position:fixed;inset:0;z-index:19;cursor:nwse-resize}
@media (max-width:900px){#url{width:220px}#label{width:130px}.ver{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="grp"><b>HTML → Figma</b><span class="ver">v1.0.0 · 틀 유지</span></div>
  <div class="grp">
    <input type="text" id="url" placeholder="https://srleeinkorea.github.io/…/문서.html">
    <button class="btn" id="go">불러오기</button>
    <button class="btn" id="pick">파일 선택</button>
    <input type="file" id="file" accept=".html,.htm" hidden>
  </div>
  <div class="grp"><b>화면 폭</b>
    <select id="vw"><option>1280</option><option>1440</option><option>1024</option><option value="390">390 (휴대폰)</option></select>
  </div>
  <div class="grp"><b>범위</b>
    <select id="scope"><option value="">전체 페이지</option><option value=".phone">폰 화면만 (.phone)</option><option value="custom">선택자 직접 입력</option></select>
    <input type="text" id="sel" placeholder=".phone" hidden>
  </div>
  <label class="ck" title="브라우저에서 줄이 바뀐 자리를 Figma에서도 똑같이 바꿉니다. 끄면 Figma가 줄바꿈을 다시 계산합니다."><input type="checkbox" id="keep" checked> 줄바꿈 위치 그대로</label>
  <label class="ck" title="폰 화면처럼 안쪽 스크롤에 가려진 내용까지 끝까지 펼쳐서 가져옵니다. 끄면 지금 보이는 만큼만 보이고 나머지는 잘린 채로 들어갑니다."><input type="checkbox" id="expand"> 스크롤 영역 펼치기</label>
  <div class="grp"><b>이름</b><input type="text" id="label" placeholder="프레임 이름"></div>
  <button class="btn pri" id="cap" disabled>현재 화면 Figma로 가져오기</button>
  <div class="grp" title="문서의 화면 버튼을 차례로 눌러 화면마다 한 장씩 가져옵니다. 화면설계서는 위쪽 '화면' 버튼(#jump button)을 씁니다.">
    <button class="btn pri" id="all" disabled>모든 화면 가져오기</button>
    <input type="text" id="btns" value="#jump button" style="width:110px" aria-label="화면 버튼 선택자">
    <label class="ck"><input type="checkbox" id="withScen"> 데이터 상황 포함</label>
    <button class="btn" id="stop" hidden>멈추기</button>
  </div>
</div>
<div class="stage" id="stage">
  <div id="wrap" hidden><iframe id="view" title="미리보기"></iframe></div>
  <div class="drop" id="drop">
    <b>HTML 파일을 여기에 끌어다 놓거나, 위에 주소를 넣고 불러오기</b>
    <span>불러온 화면은 이 창 안에서 그대로 눌러 볼 수 있어요. 원하는 화면을 띄운 뒤 <b style="font-size:12px">현재 화면 Figma로 가져오기</b>를 누르세요.</span>
    <span class="hint">가져올 때마다 Figma에 프레임이 하나씩 오른쪽으로 쌓여요.</span>
  </div>
</div>
<div class="status" id="status"><span class="hint">대기 중</span></div>
<div id="grip" title="끌어서 창 크기 바꾸기"></div>
<div id="shield" hidden></div>

<script>
/* ═════════════════════════════════════════════════════════════════════
   화면 읽기 에이전트 — 불러온 문서 안에 넣어 실행한다.
   브라우저가 그린 결과(위치 · 크기 · 색 · 테두리 · 그림자 · 글꼴)를 읽어
   Figma 레이어 설계도(JSON)로 바꾼다. 바깥 변수를 쓰지 않는다(문자열로 주입).
   ═════════════════════════════════════════════════════════════════════ */
function h2fAgent(){
  const SKIP = new Set(['script','style','link','meta','head','title','noscript','template','base']);
  const REPLACED = new Set(['img','svg','canvas','video','iframe','input','textarea','select','br','hr','object','embed','picture','audio']);
  const R2 = n => Math.round(n*100)/100;
  const LSEP = String.fromCharCode(0x2028);   // Figma의 줄 안 줄바꿈(문단은 그대로)
  let OX=0, OY=0, SX=0, SY=0, opts={}, pending=[], count=0;

  /* ── 값 읽기 ── */
  function color(str){            // 'rgb(…)' · 'rgba(…)' → {r,g,b,a} (0~1), 투명도 0도 유지
    if(!str) return null;
    const m = String(str).match(/rgba?\(([^)]+)\)/); if(!m) return null;
    const p = m[1].split(/[\s,\/]+/).filter(Boolean).map(parseFloat);
    return {r:p[0]/255, g:p[1]/255, b:p[2]/255, a:p.length>3 ? p[3] : 1};
  }
  const visible = c => c && c.a > 0 ? c : null;
  function splitTop(s){ const out=[]; let d=0, cur=''; for(const ch of s){ if(ch==='(') d++; if(ch===')') d--; if(ch===',' && d===0){ out.push(cur.trim()); cur=''; } else cur+=ch; } if(cur.trim()) out.push(cur.trim()); return out; }
  const px = v => parseFloat(v) || 0;

  function shadows(s){
    if(!s || s==='none') return [];
    return splitTop(s).map(p => {
      const cm = p.match(/rgba?\([^)]*\)/); const c = cm ? color(cm[0]) : {r:0,g:0,b:0,a:1};
      if(!c || c.a===0) return null;
      const n = p.replace(/rgba?\([^)]*\)/,'').replace('inset','').trim().split(/\s+/).map(parseFloat).filter(x=>!isNaN(x));
      return {inset:/\binset\b/.test(p), color:c, x:n[0]||0, y:n[1]||0, blur:n[2]||0, spread:n[3]||0};
    }).filter(Boolean);
  }

  function angleOf(tok){ const v=parseFloat(tok); if(/rad$/.test(tok)) return v*180/Math.PI; if(/turn$/.test(tok)) return v*360; if(/grad$/.test(tok)) return v*0.9; return v; }
  /* CSS linear-gradient → Figma 선형 그라디언트(gradientTransform: 레이어 정규 좌표 → 그라디언트 좌표) */
  function gradient(s, w, h){
    const m = s.match(/^(?:repeating-)?linear-gradient\(([\s\S]*)\)$/); if(!m) return null;
    const parts = splitTop(m[1]); let ang = 180;
    if(/^-?[\d.]+(deg|rad|turn|grad)$/.test(parts[0])) ang = angleOf(parts.shift());
    else if(/^to\s/.test(parts[0])){
      const d = parts.shift().slice(3).trim().split(/\s+/);
      if(d.length===1) ang = {top:0, right:90, bottom:180, left:270}[d[0]];
      else { const ax = d.includes('right')?1:-1, ay = d.includes('top')?-1:1; ang = Math.atan2(ax*w, -ay*h)*180/Math.PI; }
    }
    const t = ang*Math.PI/180, sn = Math.sin(t), cs = Math.cos(t);
    const L = Math.abs(w*sn) + Math.abs(h*cs) || 1;
    const stops = [];
    for(const p of parts){
      const cm = p.match(/rgba?\([^)]*\)/); if(!cm) continue;
      const c = color(cm[0]); const rest = p.replace(cm[0],'').trim().split(/\s+/).filter(Boolean);
      const pos = rest.map(v => /%$/.test(v) ? parseFloat(v)/100 : parseFloat(v)/L).filter(v=>!isNaN(v));
      if(!pos.length) stops.push({c, p:null}); else pos.forEach(v => stops.push({c, p:v}));
    }
    if(stops.length < 2) return stops.length ? {type:'SOLID', c:stops[0].c} : null;
    if(stops[0].p==null) stops[0].p = 0;
    if(stops[stops.length-1].p==null) stops[stops.length-1].p = 1;
    for(let i=1;i<stops.length;i++){ if(stops[i].p==null){ let j=i; while(stops[j].p==null) j++; const a=stops[i-1].p, b=stops[j].p; for(let k=i;k<j;k++) stops[k].p = a + (b-a)*(k-i+1)/(j-i+1); } if(stops[i].p < stops[i-1].p) stops[i].p = stops[i-1].p; }
    const m2 = [[w*sn/L, -h*cs/L, 0.5 - 0.5*w*sn/L + 0.5*h*cs/L],
                [w*cs/L,  h*sn/L, 0.5 - 0.5*w*cs/L - 0.5*h*sn/L]];
    return {type:'GRADIENT_LINEAR', m:m2, stops:stops.map(s=>({p:Math.max(0,Math.min(1,s.p)), c:s.c}))};
  }

  /* ── 이미지 → PNG(base64) ── */
  function loadImg(src){
    return new Promise(res => {
      const im = new Image(); let done=false; const fin = v => { if(!done){ done=true; res(v); } };
      if(/^https?:/.test(src)) im.crossOrigin = 'anonymous';
      im.onload = () => fin(im); im.onerror = () => fin(null); setTimeout(()=>fin(null), 6000);
      im.src = src;
    });
  }
  function toB64(img, w, h){
    try{
      const W = w || img.naturalWidth || 1, H = h || img.naturalHeight || 1;
      const s = Math.min(2, 2048/Math.max(W,H,1));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(W*s)); c.height = Math.max(1, Math.round(H*s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/png').split(',')[1];
    }catch(e){ return null; }
  }

  /* ── 상자 모양(배경 · 테두리 · 모서리 · 그림자) ── */
  function visual(el, cs, W, H, X, Y, extra){
    const fills = [];
    const bg = visible(color(cs.backgroundColor)); if(bg) fills.push({type:'SOLID', c:bg});
    const bi = cs.backgroundImage;
    if(bi && bi!=='none'){
      for(const L of splitTop(bi).reverse()){
        if(/linear-gradient/.test(L)){ const g = gradient(L, W, H); if(g) fills.push(g); }
        else if(/gradient/.test(L)){ const cm = L.match(/rgba?\([^)]*\)/); if(cm){ const c=visible(color(cm[0])); if(c) fills.push({type:'SOLID', c}); } }
        else {
          const um = L.match(/url\(["']?([\s\S]*?)["']?\)$/); if(!um) continue;
          const size = cs.backgroundSize, rep = cs.backgroundRepeat;
          const sm = size.match(/^([\d.]+)px(?:\s+([\d.]+)px)?$/);
          if(sm && /no-repeat/.test(rep)){                      // 크기를 정한 아이콘 배경 → 별도 이미지 레이어
            const iw = parseFloat(sm[1]), ih = sm[2] ? parseFloat(sm[2]) : iw;
            const [bx, by] = cs.backgroundPosition.split(' ').map((v,i) => /%$/.test(v) ? ((i?H-ih:W-iw)*parseFloat(v)/100) : px(v));
            const node = {t:'image', name:'background', x:R2(X+bx), y:R2(Y+by), w:iw, h:ih, b64:null, scale:'FIT', z:0};
            pending.push(loadImg(um[1]).then(im => { node.b64 = im ? toB64(im, iw*2, ih*2) : null; }));
            extra.push(node);
          } else {
            const f = {type:'IMAGE', b64:null, scale: size==='contain' ? 'FIT' : 'FILL'};
            fills.push(f);
            pending.push(loadImg(um[1]).then(im => { f.b64 = im ? toB64(im) : null; }));
          }
        }
      }
    }
    const S = ['Top','Right','Bottom','Left'].map(k => {
      const st = cs['border'+k+'Style'];
      return {w: (st==='none'||st==='hidden') ? 0 : px(cs['border'+k+'Width']), c: visible(color(cs['border'+k+'Color'])), st};
    });
    let stroke = null; const sd = S.find(s => s.w>0 && s.c);
    if(sd) stroke = {c:sd.c, t:S[0].c?S[0].w:0, r:S[1].c?S[1].w:0, b:S[2].c?S[2].w:0, l:S[3].c?S[3].w:0, dash: S.some(s=>s.w&&s.st==='dashed') ? 'dash' : S.some(s=>s.w&&s.st==='dotted') ? 'dot' : null};
    else if(cs.outlineStyle!=='none' && px(cs.outlineWidth)>0){
      const oc = visible(color(cs.outlineColor)); const ow = px(cs.outlineWidth);
      if(oc) stroke = {c:oc, t:ow, r:ow, b:ow, l:ow, align:'OUTSIDE', dash: cs.outlineStyle==='dashed'?'dash':cs.outlineStyle==='dotted'?'dot':null};
    }
    const radius = ['TopLeft','TopRight','BottomRight','BottomLeft'].map(k => {
      const v = (cs['border'+k+'Radius']||'0').split(' ')[0];
      const n = /%$/.test(v) ? parseFloat(v)/100*Math.min(W,H) : px(v);
      return R2(Math.min(n, Math.min(W,H)/2));
    });
    const effects = shadows(cs.boxShadow);
    return {fills, stroke, radius, effects, any: !!(fills.length || stroke || effects.length)};
  }
  function hasBox(cs){
    if(visible(color(cs.backgroundColor)) || (cs.backgroundImage && cs.backgroundImage!=='none') || cs.boxShadow!=='none') return true;
    return ['Top','Right','Bottom','Left'].some(k => cs['border'+k+'Style']!=='none' && px(cs['border'+k+'Width'])>0);
  }

  /* ── 겹침 순서: 일반 흐름 0 · 위치 지정 1(+z-index) · 음수 z-index는 아래 ── */
  function zKey(cs, base){
    if(cs.position==='static') return base;
    const zi = cs.zIndex==='auto' ? 0 : parseInt(cs.zIndex,10) || 0;
    return zi < 0 ? -1 : 1 + zi;
  }
  function nameOf(el){
    const cls = (typeof el.className==='string' ? el.className : '').trim().split(/\s+/).filter(Boolean).slice(0,2).map(c=>'.'+c).join('');
    return el.tagName.toLowerCase() + (el.id ? '#'+el.id : '') + cls;
  }

  /* ── ::before · ::after — 실제 요소로 잠깐 바꿔서 위치를 잴 수 있게 한다 ── */
  function unesc(s){ return s.replace(/\\([0-9a-fA-F]{1,6})\s?/g,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/\\(.)/g,'$1'); }
  function pseudoText(el, pcs){
    const c = pcs.content; if(!c || c==='none' || c==='normal') return null;
    const re = /"((?:[^"\\]|\\.)*)"|'((?:[^'\\]|\\.)*)'|attr\(([^)]+)\)|url\([^)]*\)|counters?\([^)]*\)/g;
    let out='', any=false, m;
    while((m = re.exec(c))){ any = true; if(m[1]!=null || m[2]!=null) out += unesc(m[1]!=null ? m[1] : m[2]); else if(m[3]) out += el.getAttribute(m[3].trim()) || ''; }
    return any ? out : null;
  }
  function preparePseudo(scope){
    const made = [], marked = [];
    const all = [scope, ...scope.querySelectorAll('*')];
    const plan = [];
    for(const el of all){
      const tag = el.tagName.toLowerCase(); if(SKIP.has(tag) || REPLACED.has(tag) || tag==='h2f-pseudo') continue;
      for(const which of ['::before','::after']){
        const pcs = getComputedStyle(el, which); if(pcs.display==='none') continue;
        const txt = pseudoText(el, pcs); if(txt===null) continue;
        const style = []; for(let i=0;i<pcs.length;i++){ const p = pcs[i]; if(p==='content') continue; style.push([p, pcs.getPropertyValue(p)]); }
        plan.push({el, which, txt, style});
      }
    }
    for(const p of plan){
      const sp = document.createElement('h2f-pseudo');
      for(const [k,v] of p.style) sp.style.setProperty(k, v);
      sp.textContent = p.txt;
      if(p.which==='::before') p.el.insertBefore(sp, p.el.firstChild); else p.el.appendChild(sp);
      p.el.setAttribute(p.which==='::before' ? 'data-h2f-b' : 'data-h2f-a', '');
      made.push(sp); marked.push(p.el);
    }
    const st = document.createElement('style');
    st.textContent = '[data-h2f-b]::before{content:none!important;display:none!important}[data-h2f-a]::after{content:none!important;display:none!important}';
    document.head.appendChild(st);
    return () => { made.forEach(s => s.remove()); marked.forEach(e => { e.removeAttribute('data-h2f-b'); e.removeAttribute('data-h2f-a'); }); st.remove(); };
  }

  /* ── 글자 ── */
  function plainInline(e){
    const cs = getComputedStyle(e); if(cs.display==='none') return true;
    const tag = e.tagName.toLowerCase();
    if(tag==='br') return true;
    if(REPLACED.has(tag)) return false;
    if(!(cs.display==='inline' || cs.display==='contents')) return false;
    if(hasBox(cs)) return false;
    for(const c of e.children) if(!plainInline(c)) return false;
    return true;
  }
  function isTextBlock(el){
    if(!/\S/.test(el.textContent)) return false;
    for(const c of el.children) if(!plainInline(c)) return false;
    return true;
  }
  function runsOf(block){
    const runs = [];
    const rec = n => { for(const c of n.childNodes){
      if(c.nodeType===3) runs.push({node:c, el:n});
      else if(c.nodeType===1){ const t=c.tagName.toLowerCase(); if(t==='br') runs.push({br:true, el:n}); else if(!SKIP.has(t) && getComputedStyle(c).display!=='none') rec(c); }
    } };
    rec(block); return runs;
  }
  function decoOf(el, stop){
    const d = new Set();
    for(let e=el; e; e=e.parentElement){ const v = getComputedStyle(e).textDecorationLine; if(v && v!=='none') v.split(' ').forEach(x=>d.add(x)); if(e===stop) break; }
    return [...d].join(' ');
  }
  function styleOf(el, block){
    const cs = getComputedStyle(el);
    return {font:cs.fontFamily, w:parseInt(cs.fontWeight,10)||400, it:cs.fontStyle!=='normal', size:px(cs.fontSize), color:color(cs.color)||{r:0,g:0,b:0,a:1},
      deco:decoOf(el, block), ls: cs.letterSpacing==='normal' ? 0 : px(cs.letterSpacing), lh: cs.lineHeight==='normal' ? null : px(cs.lineHeight),
      mono: /mono|consol|courier|menlo/i.test(cs.fontFamily)};
  }
  function makeText(runs, block, name, cbox){
    const bcs = getComputedStyle(block);
    const chars=[], sty=[], pos=[], styles=[], keys=new Map();
    const sid = el => { const s = styleOf(el, block); const k = JSON.stringify(s); if(!keys.has(k)){ keys.set(k, styles.length); styles.push(s); } return keys.get(k); };
    let lastSpace = true;
    for(const r of runs){
      if(r.br){ chars.push('\n'); sty.push(sid(r.el)); pos.push(null); lastSpace = true; continue; }
      const cs = getComputedStyle(r.el), ws = cs.whiteSpace, keep = /^pre/.test(ws) || ws==='break-spaces', keepNL = keep || ws==='pre-line';
      const tt = cs.textTransform, s = sid(r.el), data = r.node.data;
      let prevCh = '';
      for(let i=0;i<data.length;i++){
        let ch = data[i];
        if(!keep && /[ \t\n\r\f]/.test(ch)){

    const rg = document.createRange();

    /* 브라우저가 줄을 바꾼 자리 찾기 — 글자 위치(top)가 한 줄 아래로 내려간 곳 */
    let breaks = 0;
    if(!nowrap){
      let prevTop = null, prevH = 0; const at = new Set();
      for(let i=0;i<chars.length;i++){
        const p = pos[i];

      if(opts.keepBreaks && at.size){

  function contentBox(el, r, cs){

  /* ── 요소 하나씩 ── */
  function walk(el, parent, zBase){

      else pending.push(loadImg(el.currentSrc || el.src).then(im => { node.b64 = im ? toB64(im) : null; }));

    const extra = [];

    if(node){ parent.children.push(node); count++; }
    extra.forEach(n => { n.z = childZ; target.children.push(n); count++; });

    else {

  }
  function marker(el, cs, r, target, z){

          svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${node.w}" height="${node.h}" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`});
        else node.children.push({t:'frame', name:'dot', x:node.x+node.w*0.3, y:node.y+node.h*0.3, w:node.w*0.4, h:node.h*0.4, fills:[{type:'SOLID', c:{r:1,g:1,b:1,a:1}}], radius:[99,99,99,99], children:[], z:1});

  /* ── 스크롤 영역 펼치기 — 안쪽 스크롤에 가려진 내용까지 보이도록 높이 제한을 잠깐 푼다 ── */

/* ═════════════════════════════════════════════════════════════════════
   플러그인 창
   ═════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const view = $('view'), wrap = $('wrap'), stage = $('stage'), drop = $('drop');
let loaded = false, docTitle = '', shots = 0, busy = false;

function status(msg, err){ const s = $('status'); s.className = 'status' + (err ? ' err' : ''); s.innerHTML = msg; }
function fit(){
  const vw = +$('vw').value; const sw = stage.clientWidth - 24, sh = stage.clientHeight - 24;
  const sc = Math.min(1, sw / vw);
  view.style.width = vw + 'px'; view.style.height = Math.round(sh / sc) + 'px';
  wrap.style.transform = `translate(12px,12px) scale(${sc})`;
}
addEventListener('resize', fit);
$('vw').onchange = () => { fit(); };

function inject(html, baseHref){
  const agent = '<script>(' + h2fAgent.toString() + ')();<\/script>';
  let out = html;
  if(baseHref){ const tag = `<base href="${baseHref.replace(/"/g,'&quot;')}">`; out = /<head[^>]*>/i.test(out) ? out.replace(/<head[^>]*>/i, m => m + tag) : tag + out; }
  out = /<\/body>/i.test(out) ? out.replace(/<\/body>(?![\s\S]*<\/body>)/i, agent + '</body>') : out + agent;
  return out;
}
function show(html, baseHref, label){
  loaded = false; shots = 0; setBusy(false);
  drop.hidden = true; wrap.hidden = false; fit();
  view.srcdoc = inject(html, baseHref);
  status('불러오는 중… ' + (label || ''));
}
$('go').onclick = async () => {
  const u = $('url').value.trim(); if(!u) return;
  try{
    status('불러오는 중… ' + u);
    const res = await fetch(u); if(!res.ok) throw new Error('HTTP ' + res.status);
    show(await res.text(), u, u);
  }catch(e){ status('불러오지 못했어요: ' + e.message + ' — 허용된 주소(manifest.json의 allowedDomains)인지 확인하거나, 파일로 저장해서 끌어다 놓아 주세요.', true); }
};
$('url').onkeydown = e => { if(e.key==='Enter') $('go').click(); };
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if(f) readFile(f); };
function readFile(f){ const rd = new FileReader(); rd.onload = () => show(rd.result, '', f.name); rd.readAsText(f, 'utf-8'); }
['dragenter','dragover'].forEach(k => stage.addEventListener(k, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave','drop'].forEach(k => stage.addEventListener(k, e => { e.preventDefault(); drop.classList.remove('on'); }));
stage.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) readFile(f); });
$('scope').onchange = () => { $('sel').hidden = $('scope').value !== 'custom'; };

/* 응답 기다리기 — 문서 쪽(list · clicked)과 Figma 쪽(done) 응답을 차례대로 받는다 */
const waiters = [];
const waitFor = type => new Promise(res => waiters.push({type, res}));
function emit(type, data){ const i = waiters.findIndex(w => w.type===type); if(i >= 0) waiters.splice(i, 1)[0].res(data); }
const ask = (msg, type) => { const p = waitFor(type); view.contentWindow.postMessage(msg, '*'); return p; };
let nextLabel = '';

addEventListener('message', e => {
  const d = e.data || {};
  if(d.pluginMessage){ fromMain(d.pluginMessage); return; }
  if(e.source !== view.contentWindow || !d.h2f) return;
  if(d.h2f==='ready'){ loaded = true; docTitle = d.title || '문서'; setBusy(false); status(`불러왔어요 · <b>${docTitle}</b> — 원하는 화면을 띄워 <b>현재 화면</b>을 가져오거나, <b>모든 화면</b>으로 화면 버튼을 차례로 가져오세요.`); }
  if(d.h2f==='list' || d.h2f==='clicked') emit(d.h2f, d);
  if(d.h2f==='result'){
    shots++;
    const label = nextLabel || $('label').value.trim() || `${docTitle} · ${shots}`;
    status(`Figma에 그리는 중… ${label} (레이어 약 ${d.out.count}개)`);
    parent.postMessage({pluginMessage:{type:'build', out:d.out, label}}, '*');
  }
  if(d.h2f==='error') emit('done', {error:'화면을 읽지 못했어요: ' + d.msg});
});
function fromMain(m){
  if(m.type==='progress') status(`Figma에 그리는 중… ${m.made}개`);
  if(m.type==='done') emit('done', m);
  if(m.type==='error') emit('done', {error:'Figma에 그리지 못했어요: ' + m.msg});
}
function setBusy(on){ busy = on; $('cap').disabled = on || !loaded; $('all').disabled = on || !loaded; $('stop').hidden = !on; }
function captureOpts(){ const scope = $('scope').value; return {selector: scope==='custom' ? $('sel').value.trim() : scope, keepBreaks:$('keep').checked, expand:$('expand').checked}; }
async function captureOnce(label){
  nextLabel = label || '';
  status('화면 읽는 중… ' + (label || ''));
  const p = waitFor('done');
  view.contentWindow.postMessage({h2f:'capture', opts:captureOpts()}, '*');
  const r = await p; nextLabel = '';
  if(r.error) throw new Error(r.error);
  return r;
}
let stopReq = false;
$('stop').onclick = () => { stopReq = true; status('지금 화면까지만 가져오고 멈춰요…'); };
$('cap').onclick = async () => {
  if(!loaded || busy) return;
  setBusy(true);
  try{ const m = await captureOnce(); $('label').value = ''; status(`완료 · <b>${m.name}</b> 레이어 ${m.made}개를 만들었어요.` + (m.fontNote ? ` <span class="hint">${m.fontNote}</span>` : '')); }
  catch(e){ status(e.message, true); }
  setBusy(false);
};
/* 모든 화면 — 화면 버튼(기본 #jump button)을 차례로 눌러 하나씩 가져온다. 데이터 상황 버튼(#scen button)도 고를 수 있다 */
$('all').onclick = async () => {
  if(!loaded || busy) return;
  const btnSel = $('btns').value.trim() || '#jump button', scenSel = '#scen button';
  const list = await ask({h2f:'list', sel:btnSel}, 'list');
  if(!list.items.length){ status(`화면 버튼을 찾지 못했어요 (${btnSel}). 문서의 화면 버튼 선택자를 넣어 주세요.`, true); return; }
  setBusy(true); stopReq = false; let n = 0;
  try{
    for(let i = 0; i < list.items.length && !stopReq; i++){
      const c = await ask({h2f:'click', sel:btnSel, index:i}, 'clicked');
      const name = c.text || list.items[i];
      const sc = $('withScen').checked ? await ask({h2f:'list', sel:scenSel}, 'list') : {items:[]};
      // 데이터 상황이 있는 화면은 기본 화면에도 상황 이름(예: '기본')을 붙여 짝을 맞춘다
      await captureOnce(`${docTitle} · ${name}` + (sc.items.length > 1 ? ` · ${sc.items[0]}` : '')); n++;
      if(sc.items.length > 1 && !stopReq){
        for(let j = 1; j < sc.items.length && !stopReq; j++){
          const s = await ask({h2f:'click', sel:scenSel, index:j}, 'clicked');
          await captureOnce(`${docTitle} · ${name} · ${s.text || sc.items[j]}`); n++;
        }
        if(sc.items.length > 1) await ask({h2f:'click', sel:scenSel, index:0}, 'clicked');   // 기본 상황으로 되돌림
      }
      status(`${i+1} / ${list.items.length} 화면 완료…`);
    }
    status(`완료 · 프레임 ${n}개를 오른쪽으로 나란히 만들었어요.` + (stopReq ? ' (중간에 멈춤)' : ''));
  }catch(e){ status(`${n}개까지 만들고 멈췄어요 — ${e.message}`, true); }
  setBusy(false);
};
/* 창 크기 조절 — 끄는 동안 미리보기 위를 덮어 마우스를 놓치지 않게 하고, 놓으면 크기를 저장한다 */
(() => {
  const grip = $('grip'), shield = $('shield'); let sx, sy, sw, sh, raf = 0, last = null;
  const send = save => { if(last) parent.postMessage({pluginMessage:{type:'resize', w:last.w, h:last.h, save}}, '*'); };
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); sx = e.screenX; sy = e.screenY; sw = innerWidth; sh = innerHeight;
    shield.hidden = false; try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  });
  shield.addEventListener('pointermove', e => grip.dispatchEvent(new PointerEvent('pointermove', e)));
  shield.addEventListener('pointerup', () => end());
  grip.addEventListener('pointermove', e => {
    if(shield.hidden) return;
    last = {w: sw + e.screenX - sx, h: sh + e.screenY - sy};
    if(!raf) raf = requestAnimationFrame(() => { raf = 0; send(false); });
  });
  const end = () => { if(shield.hidden) return; shield.hidden = true; send(true); };
  grip.addEventListener('pointerup', end); grip.addEventListener('lostpointercapture', end);
})();
fit();
</script>
</body>
