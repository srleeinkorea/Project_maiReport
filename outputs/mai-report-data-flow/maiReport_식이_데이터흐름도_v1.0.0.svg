<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="1200" height="570" fill="#f5f7fb"/><g font-family="Malgun Gothic,sans-serif" fill="#233047"><text x="35" y="45" font-size="26">maiReport 식이 데이터 흐름 · v1.0.0</text><text x="35" y="80" font-size="17">고정 1 + 관찰 회전 최대 1 · 3지선다 · 과일 추천 제외 · 전문의 승인 대기</text><rect x="35" y="125" width="360" height="120" rx="12" fill="#e7eefb"/><text x="55" y="167" font-size="21">1. 입력·개인 제한</text><text x="55" y="207" font-size="17">시각 / 응답 / 검진·진료</text><rect x="425" y="125" width="360" height="120" rx="12" fill="#e7eefb"/><text x="445" y="167" font-size="21">2. 질문·관찰</text><text x="445" y="207" font-size="17">목표 확인 분기 제거</text><rect x="815" y="125" width="360" height="120" rx="12" fill="#e7eefb"/><text x="835" y="167" font-size="21">3. 응답 저장</text><text x="835" y="207" font-size="17">28일 관찰 → 다음 날</text><rect x="35" y="295" width="360" height="120" rx="12" fill="#e7eefb"/><text x="55" y="337" font-size="21">4. 목표 선정</text><text x="55" y="377" font-size="17">회복·질환·검진·부담·일반</text><rect x="425" y="295" width="360" height="120" rx="12" fill="#e7eefb"/><text x="445" y="337" font-size="21">5. 모든 경로 공통 필터</text><text x="445" y="377" font-size="17">승인 / 제한 / 시간 / 정책</text><rect x="815" y="295" width="360" height="120" rx="12" fill="#e7eefb"/><text x="835" y="337" font-size="21">6. 목표·토글 저장</text><text x="835" y="377" font-size="17">완료 토글만 단계에 반영</text><text x="35" y="490" font-size="19">회전 응답은 식습관 관찰만 / 목표 이행 여부로 변환하지 않음</text><text x="35" y="530" font-size="17">식사 상태 ≠ 영양 적정성·질환 진단 / 정보 부족 시 개인 식사 계획 확인</text></g></svg>