<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>maiReport · RSNA 시연 버전 비교</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f5f7fa;color:#16233f}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none;background:white;border-bottom:1px solid #e5e9ef;padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:24px}
.brand{font-size:13px;font-weight:750;white-space:nowrap}.tabs{display:flex;gap:4px;padding:4px;background:#f0f3f7;border-radius:12px}
button{font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:#627086;border-radius:9px;padding:10px 18px;cursor:pointer;white-space:nowrap}
button[aria-selected=true]{background:#16233f;color:white;box-shadow:0 2px 5px #16233f1a}button:focus-visible{outline:3px solid #638fff;outline-offset:2px}
main{flex:1;min-height:0;position:relative}.panel{height:100%}.panel[hidden]{display:none}iframe{display:block;width:100%;height:100%;border:0}
@media(max-width:480px){header{padding:8px;gap:10px}.brand{display:none}button{padding:10px 14px;font-size:12px}.tabs{gap:2px}}
</style>
</head>
<body>
<header><span class="brand">maiReport 시연</span><div class="tabs" role="tablist" aria-label="시연 버전">
<button id="tab-original" role="tab" aria-selected="true" aria-controls="panel-original" tabindex="0">기존 배포 버전</button>
<button id="tab-gpt" role="tab" aria-selected="false" aria-controls="panel-gpt" tabindex="-1">수치 추가 버전</button>
</div></header>
<main>
<section class="panel" id="panel-original" role="tabpanel" aria-labelledby="tab-original"><iframe title="기존 배포 버전 시연" id="frame-original"></iframe></section>
<section class="panel" id="panel-gpt" role="tabpanel" aria-labelledby="tab-gpt" hidden><iframe title="수치 추가 버전 시연" id="frame-gpt"></iframe></section>
</main>
<script>
const versions={original:'__ORIGINAL_PAYLOAD__',gpt:'__GPT_PAYLOAD__'};
const keys=['original','gpt'];
function showVersion(key,focus=false){
  if(!keys.includes(key))key='original';
  for(const id of keys){
    const selected=id===key,tab=document.getElementById('tab-'+id);
    tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;
    document.getElementById('panel-'+id).hidden=!selected;
    if(selected){
      const frame=document.getElementById('frame-'+id);
      if(!frame.dataset.loaded){frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(versions[id]),c=>c.charCodeAt(0)));frame.dataset.loaded='true';}
      if(focus)tab.focus();
    }
  }
  history.replaceState(null,'','#'+key);
}
keys.forEach((key,index)=>{
  const tab=document.getElementById('tab-'+key);
  tab.addEventListener('click',()=>showVersion(key));
  tab.addEventListener('keydown',event=>{
    if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
      event.preventDefault();showVersion(event.key==='Home'?'original':event.key==='End'?'gpt':keys[1-index],true);
    }
  });
});
window.addEventListener('hashchange',()=>showVersion(location.hash.slice(1)));
showVersion(location.hash.slice(1));
</script>
</body>
</html>
