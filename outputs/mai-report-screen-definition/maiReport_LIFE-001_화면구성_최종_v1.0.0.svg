    <rect y="12" width="354" height="286" rx="17" fill="#FFFFFF" stroke="#DCE3ED"/>
    <text x="22" y="44" font-size="12" font-weight="800" fill="#101A2B">위 블록 — 오늘 할 일</text>
    <text x="22" y="66" font-size="11" fill="#4B586C">목표가 있으면 카드 3장, 없으면 질문 유도.</text>
    <text x="22" y="83" font-size="11" fill="#4B586C">과거 날짜에서는 질문 유도를 하지 않는다.</text>

    <text x="22" y="117" font-size="12" font-weight="800" fill="#101A2B">아래 블록 — 지금까지의 현황</text>
