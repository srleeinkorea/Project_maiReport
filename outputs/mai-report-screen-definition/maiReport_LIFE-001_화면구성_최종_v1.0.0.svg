    <text x="22" y="44" font-size="12" font-weight="800" fill="#B23A3A">금지 어휘 「꾸준히」 2건</text>
    <text x="22" y="66" font-size="11" fill="#4B586C">03 「2주 동안 꾸준히 해냈어요」</text>
    <text x="22" y="83" font-size="11" fill="#4B586C">06 제목 「세 가지 모두 꾸준히」</text>
    <text x="22" y="102" font-size="10.5" fill="#8A5252">지표 기획서 v0.3 규칙 · 배포 검사에서 막힌다</text>

    <text x="22" y="138" font-size="12" font-weight="800" fill="#B23A3A">02와 09는 타일이 같다</text>
    <text x="22" y="160" font-size="11" fill="#4B586C">방문 7일 이상이면 연속은 반드시 0이라</text>
    <text x="22" y="177" font-size="11" fill="#4B586C">여섯 칸이 글자까지 동일하다. 가르는 것은</text>
    <text x="22" y="194" font-size="11" fill="#4B586C">안내 속 마지막 일자뿐.</text>

    <text x="22" y="230" font-size="12" font-weight="800" fill="#96650A">과거 입력 허용 기간 미정</text>
    <text x="22" y="252" font-size="11" fill="#4B586C">며칠 전까지 메울 수 있는지가 이 기능의</text>
    <text x="22" y="269" font-size="11" fill="#4B586C">실질 범위를 정한다 — 짧게 두기를 권함.</text>
