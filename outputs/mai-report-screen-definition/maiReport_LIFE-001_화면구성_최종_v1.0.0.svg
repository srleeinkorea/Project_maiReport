      <text x="18" y="24" font-size="10" font-family="JetBrains Mono, Consolas, monospace" fill="#8D99AB">01</text>
      <text x="44" y="24" font-size="10.5" font-weight="800" fill="#5E6C82">첫 실천을 기록해 볼까요?</text>
      <text x="18" y="48" fill="#3C4460">오늘의 목표 중 실천한 것이 있나요?</text>
      <text x="18" y="66" fill="#3C4460">완료한 목표에 표시해 보세요.</text>
      <text x="18" y="86" font-size="9.5" fill="#95A0B0">완료 이력 0건</text>
    </g>
    <!-- 02 -->
    <g transform="translate(430,786)">
