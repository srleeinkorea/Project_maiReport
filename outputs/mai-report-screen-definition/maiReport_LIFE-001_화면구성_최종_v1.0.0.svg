    <text x="22" y="190" font-size="12" font-weight="800" fill="#101A2B">안내 한 줄</text>
    <text x="22" y="212" font-size="11" fill="#4B586C">위에서부터 조건을 보다가 처음 맞는 하나.</text>
    <text x="22" y="229" font-size="11" fill="#4B586C">동시에 맞아도 하나만 보여준다.</text>

