<svg xmlns="http://www.w3.org/2000/svg" width="1214" height="672" viewBox="0 0 1214 672" font-family="Noto Sans KR, Malgun Gothic, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA7BA"/>
    </marker>
  </defs>
  <rect width="1214" height="672" fill="#EFF2F7"/>

  <text x="40" y="40" font-size="18" font-weight="900" letter-spacing="-0.8" fill="#0F1826">maiReport · LIFE-001 — 최초 진입부터 첫 기록까지</text>
  <text x="40" y="61" font-size="12" fill="#6C7A8E">기기 데이터가 모자라면 질문으로 보충하므로, 가입 직후 처음 보는 것은 목표 카드가 아니라 질문이다</text>

  <!-- ===== 1 최초 진입 ===== -->
  <g transform="translate(40,92)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">1 · 가입 후 처음 들어왔을 때</text>
    <rect y="12" width="354" height="330" rx="17" fill="#F4F6FA" stroke="#DFE4EC"/>

    <rect x="14" y="26" width="326" height="128" rx="14" fill="#FFFFFF"/>
    <text x="30" y="52" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">오늘의 목표</text>
    <rect x="30" y="64" width="294" height="76" rx="12" fill="#EDF3FF" stroke="#CFDEFF"/>
    <text x="44" y="86" font-size="10" font-weight="800" fill="#2F6BFF">오늘 목표를 받으려면</text>
    <text x="44" y="106" font-size="12" fill="#3C4460">몇 가지만 답하면 오늘 목표를</text>
    <text x="44" y="122" font-size="12" fill="#3C4460">만들어 드려요.</text>
    <rect x="230" y="108" width="80" height="22" rx="11" fill="#2F6BFF"/>
    <text x="270" y="123" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">질문에 답하기</text>

    <rect x="14" y="164" width="326" height="164" rx="14" fill="#FFFFFF"/>
    <text x="30" y="190" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="30" y="202" width="92" height="66" rx="12" fill="#FCEBD8"/>
    <text x="76" y="222" font-size="10" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="76" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="76" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="131" y="202" width="92" height="66" rx="12" fill="#FBDDE6"/>
    <text x="177" y="222" font-size="10" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="177" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="177" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="232" y="202" width="92" height="66" rx="12" fill="#DFE2FA"/>
    <text x="278" y="222" font-size="10" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="278" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="278" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="30" y="278" width="294" height="38" rx="11" fill="#ECF1F7"/>
    <text x="44" y="302" font-size="11.5" fill="#3C4460">아직 기록이 없어요. 여기에 쌓입니다.</text>
  </g>

