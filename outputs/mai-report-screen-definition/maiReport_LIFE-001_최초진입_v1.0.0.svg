  <!-- 화살표 -->
  <g stroke="#9AA7BA" stroke-width="1.4" fill="none">
    <path d="M398,262 L424,262" marker-end="url(#a2)"/>
    <path d="M788,262 L814,262" marker-end="url(#a2)"/>
  </g>
  <text x="411" y="252" font-size="9.5" fill="#8D99AB" text-anchor="middle">답함</text>
  <text x="801" y="252" font-size="9.5" fill="#8D99AB" text-anchor="middle">완료</text>

  <!-- 하단 정리 -->
  <g transform="translate(40,460)">
    <rect width="1134" height="176" rx="15" fill="#FFFFFF" stroke="#DCE3ED"/>
    <text x="24" y="32" font-size="12.5" font-weight="800" fill="#101A2B">최초 진입에 목표 카드는 없다</text>
    <text x="24" y="55" font-size="11.5" fill="#4B586C">기기 데이터가 모자라면 질문으로 보충하는 구조라, 가입 직후 처음 보는 것은 <tspan font-weight="700" fill="#1B2739">질문 유도</tspan>다.</text>
    <text x="24" y="74" font-size="11.5" fill="#4B586C">「첫 실천을 기록해 볼까요 · 완료한 목표에 표시해 보세요」는 <tspan font-weight="700" fill="#1B2739">질문에 답한 뒤에야</tspan> 맞는 말이 된다 — 표시할 목표가 그때 생기므로.</text>

    <rect x="24" y="92" width="1086" height="1" fill="#E4EAF2"/>

    <text x="24" y="118" font-size="12.5" font-weight="800" fill="#1C7A57">타일은 목표가 없어도 정상으로 나온다</text>
    <text x="24" y="140" font-size="11.5" fill="#4B586C">타일은 <tspan font-weight="700" fill="#1B2739">완료 이력</tspan>으로 계산하므로 목표 유무와 무관하다. 읽기 전용이라 비활성할 이유도 없다.</text>
    <text x="24" y="159" font-size="11.5" fill="#4B586C">앞서 그린 <tspan font-family="JetBrains Mono, Consolas, monospace" font-size="11">—</tspan> 세 칸은 틀렸다 — 어제까지 10일 연속이었다면 목표가 없는 날에도 <tspan font-weight="700" fill="#1B2739">10일 연속</tspan>이 그대로 떠야 한다.</text>
  </g>

  <text x="1174" y="660" font-size="10.5" fill="#8D99AB" text-anchor="end">기획서 v2.0 · 04장 타일 표시 · 06장 안내 문구</text>
</svg>
