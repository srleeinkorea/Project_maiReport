    <rect x="131" y="64" width="92" height="76" rx="12" fill="#FFFFFF" stroke="#F0F3F8"/>
    <text x="141" y="82" font-size="9.5" font-weight="800" fill="#E0567B">활동</text>
    <text x="141" y="98" font-size="10.5" font-weight="700" fill="#16202F">식후 10분</text>
    <text x="141" y="112" font-size="10.5" font-weight="700" fill="#16202F">걷기</text>
    <rect x="141" y="120" width="72" height="12" rx="6" fill="#FBDDE6"/>
    <rect x="232" y="64" width="92" height="76" rx="12" fill="#FFFFFF" stroke="#F0F3F8"/>
    <text x="242" y="82" font-size="9.5" font-weight="800" fill="#6B72D8">수면</text>
    <text x="242" y="98" font-size="10.5" font-weight="700" fill="#16202F">23시 30분에</text>
    <text x="242" y="112" font-size="10.5" font-weight="700" fill="#16202F">눕기</text>
    <rect x="242" y="120" width="72" height="12" rx="6" fill="#DFE2FA"/>

    <rect x="14" y="164" width="326" height="164" rx="14" fill="#FFFFFF"/>
    <text x="30" y="190" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="30" y="202" width="92" height="66" rx="12" fill="#FCEBD8"/>
    <text x="76" y="222" font-size="10" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="76" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="76" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="131" y="202" width="92" height="66" rx="12" fill="#FBDDE6"/>
    <text x="177" y="222" font-size="10" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="177" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="177" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="232" y="202" width="92" height="66" rx="12" fill="#DFE2FA"/>
    <text x="278" y="222" font-size="10" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="278" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="278" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="30" y="278" width="294" height="38" rx="11" fill="#ECF1F7"/>
    <text x="44" y="295" font-size="10" font-weight="800" fill="#5E6C82">첫 실천을 기록해 볼까요?</text>
    <text x="44" y="310" font-size="11" fill="#3C4460">완료한 목표에 표시해 보세요.</text>
  </g>

  <!-- ===== 3 첫 완료 ===== -->
  <g transform="translate(820,92)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">3 · 하나를 완료한 뒤</text>
    <rect y="12" width="354" height="330" rx="17" fill="#F4F6FA" stroke="#DFE4EC"/>

    <rect x="14" y="26" width="326" height="128" rx="14" fill="#FFFFFF"/>
    <text x="30" y="52" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">오늘의 목표</text>
    <text x="324" y="52" font-size="10" fill="#7A879A" text-anchor="end">1/3 완료</text>
    <rect x="30" y="64" width="92" height="76" rx="12" fill="#FCEBD8"/>
    <text x="40" y="82" font-size="9.5" font-weight="800" fill="#B4611F">식이</text>
    <text x="40" y="98" font-size="10.5" font-weight="700" fill="#A08A72">저녁 균형</text>
    <text x="40" y="112" font-size="10.5" font-weight="700" fill="#A08A72">식사</text>
    <circle cx="104" cy="78" r="9" fill="#E0803A"/>
    <text x="104" y="82" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <rect x="131" y="64" width="92" height="76" rx="12" fill="#FFFFFF" stroke="#F0F3F8"/>
    <text x="141" y="82" font-size="9.5" font-weight="800" fill="#E0567B">활동</text>
    <text x="141" y="98" font-size="10.5" font-weight="700" fill="#16202F">식후 10분</text>
    <text x="141" y="112" font-size="10.5" font-weight="700" fill="#16202F">걷기</text>
    <rect x="141" y="120" width="72" height="12" rx="6" fill="#FBDDE6"/>
    <rect x="232" y="64" width="92" height="76" rx="12" fill="#FFFFFF" stroke="#F0F3F8"/>
    <text x="242" y="82" font-size="9.5" font-weight="800" fill="#6B72D8">수면</text>
    <text x="242" y="98" font-size="10.5" font-weight="700" fill="#16202F">23시 30분에</text>
    <text x="242" y="112" font-size="10.5" font-weight="700" fill="#16202F">눕기</text>
    <rect x="242" y="120" width="72" height="12" rx="6" fill="#DFE2FA"/>

    <rect x="14" y="164" width="326" height="164" rx="14" fill="#FFFFFF"/>
    <text x="30" y="190" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="30" y="202" width="92" height="66" rx="12" fill="#FCEBD8"/>
    <text x="76" y="222" font-size="10" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="76" y="244" font-size="16" font-weight="900" letter-spacing="-0.6" fill="#16202F" text-anchor="middle">1<tspan font-size="10">일 연속</tspan></text>
    <text x="76" y="259" font-size="9" fill="#6E7C90" text-anchor="middle">이어가는 중</text>
    <rect x="131" y="202" width="92" height="66" rx="12" fill="#FBDDE6"/>
    <text x="177" y="222" font-size="10" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="177" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="177" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="232" y="202" width="92" height="66" rx="12" fill="#DFE2FA"/>
    <text x="278" y="222" font-size="10" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="278" y="242" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">시작 전</text>
    <text x="278" y="258" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="30" y="278" width="294" height="38" rx="11" fill="#FCEBD8"/>
    <text x="44" y="295" font-size="10" font-weight="800" fill="#B4611F">가장 오래 이어온 실천</text>
    <text x="44" y="310" font-size="11" fill="#3C4460">식이를 1일 연속 이어가고 있어요.</text>
