  <g transform="translate(430,92)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">2 · 질문에 답해서 목표가 생긴 뒤</text>
    <rect y="12" width="354" height="330" rx="17" fill="#F4F6FA" stroke="#DFE4EC"/>

    <rect x="14" y="26" width="326" height="128" rx="14" fill="#FFFFFF"/>
    <text x="30" y="52" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">오늘의 목표</text>
    <text x="324" y="52" font-size="10" fill="#7A879A" text-anchor="end">0/3 완료</text>
    <rect x="30" y="64" width="92" height="76" rx="12" fill="#FFFFFF" stroke="#F0F3F8"/>
    <text x="40" y="82" font-size="9.5" font-weight="800" fill="#E0803A">식이</text>
    <text x="40" y="98" font-size="10.5" font-weight="700" fill="#16202F">저녁 균형</text>
