<path d="M247 328 l-2 12 l-6 10 M245 340 l8 8 M247 328 l7 6 l7 -2 M247 331 l-8 4 l-3 8" fill="none" stroke="#E8365D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

