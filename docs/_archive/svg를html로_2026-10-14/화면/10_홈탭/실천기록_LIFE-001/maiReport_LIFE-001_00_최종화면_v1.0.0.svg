<svg xmlns="http://www.w3.org/2000/svg" width="920" height="668" viewBox="0 0 920 668" font-family="Noto Sans KR, Malgun Gothic, sans-serif">
  <rect width="920" height="668" fill="#EFF2F7"/>

  <text x="40" y="38" font-size="18" font-weight="900" letter-spacing="-0.8" fill="#0F1826">00 · 목표가 생성되지 않음 — 최종 화면</text>
  <text x="40" y="58" font-size="12" fill="#6C7A8E">타일은 평소대로 · 목표 카드 블록은 그리지 않음 · 문구만 기준일로 갈림</text>

  <!-- ===== 오늘 ===== -->
  <g transform="translate(40,84)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#2F6BFF">오늘 (8월 20일)</text>
    <rect y="12" width="390" height="352" rx="22" fill="#F4F6FA" stroke="#DFE4EC"/>

    <text x="20" y="46" font-size="18" font-weight="900" letter-spacing="-0.7" fill="#16202F">생활</text>
    <text x="20" y="63" font-size="10.5" fill="#7A879A">8월 4주차</text>
    <rect x="306" y="32" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#DFE4EC"/>
    <text x="338" y="49" font-size="10.5" font-weight="700" fill="#16202F" text-anchor="middle">오늘</text>

    <g font-size="9.5" text-anchor="middle">
      <text x="52" y="92" fill="#7A879A">월</text><text x="52" y="108" font-size="12.5" font-weight="700" fill="#16202F">17</text>
      <text x="100" y="92" fill="#7A879A">화</text><text x="100" y="108" font-size="12.5" font-weight="700" fill="#16202F">18</text>
      <text x="148" y="92" fill="#7A879A">수</text><text x="148" y="108" font-size="12.5" font-weight="700" fill="#16202F">19</text>
      <text x="244" y="92" fill="#C3CCD9">금</text><text x="244" y="108" font-size="12.5" font-weight="700" fill="#C3CCD9">21</text>
      <text x="292" y="92" fill="#C3CCD9">토</text><text x="292" y="108" font-size="12.5" font-weight="700" fill="#C3CCD9">22</text>
      <text x="340" y="92" fill="#C3CCD9">일</text><text x="340" y="108" font-size="12.5" font-weight="700" fill="#C3CCD9">23</text>
    </g>
    <rect x="176" y="78" width="40" height="36" rx="11" fill="#2F6BFF"/>
    <text x="196" y="92" font-size="9.5" fill="#DCE7FF" text-anchor="middle">오늘</text>
    <text x="196" y="108" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">20</text>

    <rect x="18" y="128" width="354" height="44" rx="13" fill="none" stroke="#D5DCE7" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="195" y="155" font-size="10.5" fill="#A3AEBF" text-anchor="middle">「오늘의 목표」 블록은 그리지 않는다</text>

    <rect x="18" y="184" width="354" height="164" rx="16" fill="#FFFFFF"/>
    <text x="36" y="210" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="36" y="222" width="102" height="62" rx="12" fill="#FCEBD8"/>
    <text x="87" y="242" font-size="10" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="87" y="262" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">다시 시작</text>
    <text x="87" y="276" font-size="9" fill="#95A0B0" text-anchor="middle">오늘 하면 1일째</text>
    <rect x="146" y="222" width="102" height="62" rx="12" fill="#FBDDE6"/>
    <text x="197" y="242" font-size="10" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="197" y="264" font-size="16" font-weight="900" letter-spacing="-0.6" fill="#16202F" text-anchor="middle">6<tspan font-size="10">일 연속</tspan></text>
    <text x="197" y="278" font-size="9" fill="#6E7C90" text-anchor="middle">이어가는 중</text>
    <rect x="256" y="222" width="102" height="62" rx="12" fill="#DFE2FA"/>
    <text x="307" y="242" font-size="10" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="307" y="264" font-size="16" font-weight="900" letter-spacing="-0.6" fill="#16202F" text-anchor="middle">14<tspan font-size="10">일 연속</tspan></text>
    <text x="307" y="278" font-size="9" font-weight="800" fill="#4A51BC" text-anchor="middle">8월 7일로부터</text>

    <rect x="36" y="294" width="322" height="42" rx="12" fill="#ECF1F7"/>
    <text x="50" y="312" font-size="10" font-weight="800" fill="#5E6C82">오늘 목표가 아직 없어요</text>
    <text x="50" y="329" font-size="11.5" fill="#3C4460">오늘의 질문에 답하면 목표를 만들어 드려요.</text>
  </g>

  <!-- ===== 과거 ===== -->
  <g transform="translate(490,84)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">과거 (8월 14일 선택)</text>
    <rect y="12" width="390" height="352" rx="22" fill="#F4F6FA" stroke="#DFE4EC"/>

    <text x="20" y="46" font-size="18" font-weight="900" letter-spacing="-0.7" fill="#16202F">생활</text>
    <text x="20" y="63" font-size="10.5" fill="#7A879A">8월 3주차</text>
    <rect x="306" y="32" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#DFE4EC"/>
    <text x="338" y="49" font-size="10.5" font-weight="700" fill="#2F6BFF" text-anchor="middle">오늘</text>

    <g font-size="9.5" text-anchor="middle">
      <text x="52" y="92" fill="#7A879A">월</text><text x="52" y="108" font-size="12.5" font-weight="700" fill="#16202F">11</text>
      <text x="100" y="92" fill="#7A879A">화</text><text x="100" y="108" font-size="12.5" font-weight="700" fill="#16202F">12</text>
      <text x="148" y="92" fill="#7A879A">수</text><text x="148" y="108" font-size="12.5" font-weight="700" fill="#16202F">13</text>
      <text x="244" y="92" fill="#7A879A">금</text><text x="244" y="108" font-size="12.5" font-weight="700" fill="#16202F">15</text>
      <text x="292" y="92" fill="#7A879A">토</text><text x="292" y="108" font-size="12.5" font-weight="700" fill="#16202F">16</text>
      <text x="340" y="92" fill="#7A879A">일</text><text x="340" y="108" font-size="12.5" font-weight="700" fill="#16202F">17</text>
    </g>
    <rect x="176" y="78" width="40" height="36" rx="11" fill="#16202F"/>
    <text x="196" y="92" font-size="9.5" fill="#B9C3D1" text-anchor="middle">목</text>
    <text x="196" y="108" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">14</text>

    <rect x="18" y="128" width="354" height="44" rx="13" fill="none" stroke="#D5DCE7" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="195" y="155" font-size="10.5" fill="#A3AEBF" text-anchor="middle">「오늘의 목표」 블록은 그리지 않는다</text>

    <rect x="18" y="184" width="354" height="164" rx="16" fill="#FFFFFF"/>
    <text x="36" y="210" font-size="14" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="36" y="222" width="102" height="62" rx="12" fill="#FCEBD8"/>
    <text x="87" y="242" font-size="10" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="87" y="266" font-size="12.5" font-weight="900" fill="#66748A" text-anchor="middle">기록 없음</text>
    <rect x="146" y="222" width="102" height="62" rx="12" fill="#FBDDE6"/>
    <text x="197" y="242" font-size="10" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="197" y="264" font-size="16" font-weight="900" letter-spacing="-0.6" fill="#16202F" text-anchor="middle">3<tspan font-size="10">일 연속</tspan></text>
    <text x="197" y="278" font-size="9" font-weight="800" fill="#1C7A57" text-anchor="middle">8월 14일까지</text>
    <rect x="256" y="222" width="102" height="62" rx="12" fill="#DFE2FA"/>
    <text x="307" y="242" font-size="10" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="307" y="264" font-size="16" font-weight="900" letter-spacing="-0.6" fill="#16202F" text-anchor="middle">6<tspan font-size="10">일 연속</tspan></text>
    <text x="307" y="278" font-size="9" font-weight="800" fill="#1C7A57" text-anchor="middle">8월 14일까지</text>

    <rect x="36" y="294" width="322" height="58" rx="12" fill="#ECF1F7"/>
    <text x="50" y="312" font-size="10" font-weight="800" fill="#5E6C82">생성된 목표가 없어요</text>
    <text x="50" y="329" font-size="11.5" fill="#3C4460">이 날은 목표를 만들 정보가 부족했어요.</text>
    <text x="50" y="345" font-size="11.5" fill="#3C4460">다른 날짜의 기록을 확인해 보세요.</text>
  </g>

  <!-- ===== 정리 ===== -->
  <g transform="translate(40,472)">
    <rect width="840" height="160" rx="15" fill="#FFFFFF" stroke="#DCE3ED"/>

    <text x="24" y="32" font-size="12.5" font-weight="800" fill="#101A2B">같은 것 — 타일</text>
    <text x="24" y="54" font-size="11.5" fill="#4B586C">타일은 <tspan font-weight="700" fill="#1B2739">완료 이력</tspan>으로 계산하고 읽기 전용이라 목표 유무와 무관하다.
      회색 「—」로 비우지 않는다.</text>
    <text x="24" y="73" font-size="11.5" fill="#4B586C">과거에서 달라지는 것은 보조 문구뿐 — <tspan font-weight="700" fill="#1C7A57">8월 14일까지</tspan> ·
      그날 미완료면 전날 유예 없이 <tspan font-weight="700" fill="#1B2739">기록 없음</tspan>.</text>

    <rect x="24" y="92" width="792" height="1" fill="#E4EAF2"/>

    <text x="24" y="118" font-size="12.5" font-weight="800" fill="#2F6BFF">다른 것 — 문구</text>
    <text x="24" y="140" font-size="11.5" fill="#4B586C"><tspan font-weight="700" fill="#1B2739">오늘은 아직 바뀔 수 있는 날</tspan>이라 어떻게 하면 목표가 생기는지 알려준다.
      <tspan font-weight="700" fill="#1B2739">과거는 확정된 날</tspan>이라 이유만 말하고 다른 날짜로 안내한다.</text>
  </g>
</svg>
