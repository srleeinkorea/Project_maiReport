<svg xmlns="http://www.w3.org/2000/svg" width="828" height="612" viewBox="0 0 828 612" font-family="Noto Sans KR, Malgun Gothic, sans-serif">
  <rect width="828" height="612" fill="#EFF2F7"/>
  <text x="40" y="38" font-size="17" font-weight="900" letter-spacing="-0.7" fill="#0F1826">00 · 목표가 세 개 모두 생성되지 않음 — 오늘과 과거 날짜</text>
  <text x="40" y="58" font-size="12" fill="#6C7A8E">문구까지 완전히 같다 — 시제 중립 표현이라 날짜 분기가 없다 · 완료 처리는 어느 쪽도 불가</text>

  <!-- ============ 오늘 ============ -->
  <g transform="translate(40,90)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">오늘 (8월 20일)</text>

    <rect y="14" width="354" height="52" rx="14" fill="#FFFFFF"/>
    <g font-size="11" fill="#8D99AB" text-anchor="middle">
      <text x="46" y="34">수</text><text x="46" y="52" font-size="13" font-weight="700" fill="#16202F">19</text>
      <text x="130" y="34" fill="#DCE7FF">오늘</text>
      <text x="214" y="34" fill="#C3CCD9">금</text><text x="214" y="52" font-size="13" font-weight="700" fill="#C3CCD9">21</text>
      <text x="298" y="34" fill="#C3CCD9">토</text><text x="298" y="52" font-size="13" font-weight="700" fill="#C3CCD9">22</text>
    </g>
    <rect x="110" y="22" width="40" height="36" rx="11" fill="#2F6BFF"/>
    <text x="130" y="34" font-size="11" fill="#DCE7FF" text-anchor="middle">오늘</text>
    <text x="130" y="52" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">20</text>

    <rect y="78" width="354" height="246" rx="17" fill="#FFFFFF"/>
    <text x="16" y="109" font-size="15" font-weight="900" letter-spacing="-0.6" fill="#16202F">목표 이어가기</text>
    <rect x="16" y="129" width="102" height="88" rx="13" fill="#EDF0F4"/>
    <text x="67" y="152" font-size="11" font-weight="800" fill="#A9B3C0" text-anchor="middle">식이</text>
    <text x="67" y="183" font-size="13.5" font-weight="900" fill="#A9B3C0" text-anchor="middle">—</text>
    <rect x="126" y="129" width="102" height="88" rx="13" fill="#EDF0F4"/>
    <text x="177" y="152" font-size="11" font-weight="800" fill="#A9B3C0" text-anchor="middle">활동</text>
    <text x="177" y="183" font-size="13.5" font-weight="900" fill="#A9B3C0" text-anchor="middle">—</text>
    <rect x="236" y="129" width="102" height="88" rx="13" fill="#EDF0F4"/>
    <text x="287" y="152" font-size="11" font-weight="800" fill="#A9B3C0" text-anchor="middle">수면</text>
    <text x="287" y="183" font-size="13.5" font-weight="900" fill="#A9B3C0" text-anchor="middle">—</text>
    <rect x="16" y="230" width="322" height="78" rx="13" fill="#ECF1F7"/>
    <text x="30" y="254" font-size="10" font-weight="800" fill="#5E6C82">생성된 목표가 없어요</text>
    <text x="30" y="276" font-size="12" fill="#3C4460">데이터가 부족해 목표를 추천하지 못했어요.</text>
    <text x="30" y="296" font-size="12" font-weight="700" fill="#1C7A57">연속 기록은 그대로 이어져요.</text>
  </g>

  <!-- ============ 과거 ============ -->
  <g transform="translate(434,90)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">과거 날짜 (8월 14일 선택)</text>

    <rect y="14" width="354" height="52" rx="14" fill="#FFFFFF"/>
    <g font-size="11" fill="#8D99AB" text-anchor="middle">
      <text x="46" y="34">화</text><text x="46" y="52" font-size="13" font-weight="700" fill="#16202F">13</text>
      <text x="214" y="34">목</text><text x="214" y="52" font-size="13" font-weight="700" fill="#16202F">15</text>
      <text x="298" y="34">금</text><text x="298" y="52" font-size="13" font-weight="700" fill="#16202F">16</text>
    </g>
    <rect x="110" y="22" width="40" height="36" rx="11" fill="#16202F"/>
    <text x="130" y="34" font-size="11" fill="#B9C3D1" text-anchor="middle">수</text>
    <text x="130" y="52" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">14</text>

    <rect y="78" width="354" height="246" rx="17" fill="#FFFFFF"/>
    <text x="16" y="109" font-size="15" font-weight="900" letter-spacing="-0.6" fill="#16202F">목표 이어가기</text>
    <rect x="16" y="129" width="102" height="88" rx="13" fill="#EDF0F4"/>
    <text x="67" y="152" font-size="11" font-weight="800" fill="#A9B3C0" text-anchor="middle">식이</text>
    <text x="67" y="183" font-size="13.5" font-weight="900" fill="#A9B3C0" text-anchor="middle">—</text>
    <rect x="126" y="129" width="102" height="88" rx="13" fill="#EDF0F4"/>
    <text x="177" y="152" font-size="11" font-weight="800" fill="#A9B3C0" text-anchor="middle">활동</text>
    <text x="177" y="183" font-size="13.5" font-weight="900" fill="#A9B3C0" text-anchor="middle">—</text>
    <rect x="236" y="129" width="102" height="88" rx="13" fill="#EDF0F4"/>
    <text x="287" y="152" font-size="11" font-weight="800" fill="#A9B3C0" text-anchor="middle">수면</text>
    <text x="287" y="183" font-size="13.5" font-weight="900" fill="#A9B3C0" text-anchor="middle">—</text>
    <rect x="16" y="230" width="322" height="78" rx="13" fill="#ECF1F7"/>
    <text x="30" y="254" font-size="10" font-weight="800" fill="#5E6C82">생성된 목표가 없어요</text>
    <text x="30" y="276" font-size="12" fill="#3C4460">데이터가 부족해 목표를 추천하지 못했어요.</text>
    <text x="30" y="296" font-size="12" font-weight="700" fill="#1C7A57">연속 기록은 그대로 이어져요.</text>
  </g>

  <!-- ============ 규칙 ============ -->
  <g transform="translate(40,438)">
    <rect width="748" height="140" rx="14" fill="none" stroke="#C7D1E0" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="22" y="30" font-size="12.5" font-weight="800" fill="#1C7A57">같은 것</text>
    <text x="22" y="52" font-size="11.5" fill="#4B586C">타일 세 칸 모두 회색 「—」 · 완료 처리 불가 · 위 「오늘의 목표」 카드 세 장도 비활성</text>
    <text x="22" y="72" font-size="11.5" fill="#4B586C">그날은 연속을 끊지 않고 건너뛴다 — 8월 13일까지 5일 연속이었다면 8월 15일 완료 시 6일 연속</text>

    <text x="22" y="102" font-size="12.5" font-weight="800" fill="#1C7A57">다른 것 — 없음</text>
    <text x="22" y="124" font-size="11.5" fill="#4B586C">「생성된」은 시제가 중립이라 오늘과 과거에 같은 문구를 쓴다 · 00은 날짜 분기가 없는 유일한 케이스</text>
  </g>
</svg>
