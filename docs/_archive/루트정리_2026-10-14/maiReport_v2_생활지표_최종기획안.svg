<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3260" viewBox="0 0 1600 3260">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F66F5"/>
      <stop offset="58%" stop-color="#516FFF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#14203C" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg{fill:#F5F7FB}.card{fill:#FFF;filter:url(#shadow)}
      .t1{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:54px;font-weight:800;fill:#FFF}
      .t2{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:25px;font-weight:700;fill:#1A2233}
      .t3{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:19px;font-weight:700;fill:#1A2233}
      .body{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:17px;font-weight:400;fill:#4B5468}
      .small{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:15px;font-weight:400;fill:#6E788C}
      .tiny{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:13px;font-weight:600;fill:#8892A6}
      .whiteBody{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:20px;font-weight:500;fill:#EDF2FF}
      .pill{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;font-weight:700}
      .num{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:16px;font-weight:800;fill:#2F66F5}
      .rule{font-family:'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;font-size:16px;font-weight:600;fill:#2A3A6B}
    </style>
  </defs>

  <rect class="bg" width="1600" height="3260"/>

  <!-- Hero -->
  <rect x="70" y="60" width="1460" height="300" rx="34" fill="url(#hero)"/>
  <circle cx="1430" cy="120" r="145" fill="#FFFFFF" opacity="0.08"/>
  <rect x="110" y="102" width="220" height="38" rx="19" fill="#FFFFFF" opacity="0.18"/>
  <text x="220" y="128" text-anchor="middle" class="pill" fill="#FFFFFF">maiReport v2 · 최종 제안</text>
  <text x="110" y="205" class="t1">생활 지표 최종 기획안</text>
  <text x="110" y="252" class="whiteBody">오늘의 상태 → 오늘의 행동 → 최근 흐름을 3개의 독립 지표로 해석</text>
  <text x="110" y="300" class="small" fill="#DDE5FF">목표: 사용자를 평가하는 점수가 아니라, 생활 패턴을 이해하고 조절 가능한 지점을 보여주는 해석 지표</text>

  <!-- Core architecture -->
  <rect x="70" y="395" width="1460" height="360" rx="28" class="card"/>
  <text x="105" y="447" class="t2">1. 지표 체계의 핵심 구조</text>
  <text x="105" y="482" class="body">세 지표는 합산·평균하지 않고 서로 다른 질문에 답하도록 분리합니다.</text>

  <!-- 3 cards -->
  <rect x="105" y="525" width="430" height="185" rx="22" fill="#EAF8EF" stroke="#BDE8CF"/>
  <rect x="585" y="525" width="430" height="185" rx="22" fill="#FFF4E3" stroke="#F5D7A2"/>
  <rect x="1065" y="525" width="430" height="185" rx="22" fill="#F1ECFF" stroke="#D5C6FA"/>

  <text x="135" y="565" class="tiny" fill="#12A150">I1 · STATE</text>
  <text x="135" y="603" class="t2" fill="#145E39">생활여유</text>
  <text x="135" y="637" class="body">오늘 생활 리듬에 얼마나</text>
  <text x="135" y="665" class="body">여유가 있는가?</text>
  <text x="135" y="695" class="small">수면 + 활동 배치 + 비활동</text>

  <text x="615" y="565" class="tiny" fill="#D98A12">I2 · ACTION</text>
  <text x="615" y="603" class="t2" fill="#7A5710">자기돌봄</text>
  <text x="615" y="637" class="body">행동 가능한 순간에 실제</text>
  <text x="615" y="665" class="body">돌봄 행동을 연결했는가?</text>
  <text x="615" y="695" class="small">기준점 + 시간대별 실제 행동</text>

  <text x="1095" y="565" class="tiny" fill="#7C5CFC">I3 · TREND</text>
  <text x="1095" y="603" class="t2" fill="#4D3E8E">일상안정</text>
  <text x="1095" y="637" class="body">최근 생활 흐름이 평소 대비</text>
  <text x="1095" y="665" class="body">얼마나 안정적으로 이어지는가?</text>
  <text x="1095" y="695" class="small">최근 7일 vs 개인 기준</text>

  <!-- Detailed definitions -->
  <rect x="70" y="790" width="1460" height="565" rx="28" class="card"/>
  <text x="105" y="842" class="t2">2. 지표별 최종 정의 및 산출 방향</text>

  <!-- I1 row -->
  <circle cx="130" cy="925" r="28" fill="#12A150"/><text x="130" y="932" text-anchor="middle" class="pill" fill="#FFF">I1</text>
  <text x="180" y="915" class="t3">생활여유 · 오늘의 상태</text>
  <text x="180" y="947" class="body">수면과 활동 패턴을 기반으로, 오늘 생활의 부담이 한쪽으로 몰려 있는지와 생활 리듬에 여유가 있는지를 해석합니다.</text>
  <text x="180" y="982" class="small">핵심 입력: 수면, 활동 분산, 긴 비활동, 늦은 시간 활동 몰림 · 질문 응답은 점수 가감이 아니라 해석 보조</text>
  <line x1="105" y1="1020" x2="1495" y2="1020" stroke="#E6EAF2"/>

  <!-- I2 row -->
  <circle cx="130" cy="1095" r="28" fill="#D98A12"/><text x="130" y="1102" text-anchor="middle" class="pill" fill="#FFF">I2</text>
  <text x="180" y="1085" class="t3">자기돌봄 · 오늘의 행동</text>
  <text x="180" y="1117" class="body">식사·긴 비활동 등 ‘행동 가능한 기준점’ 주변에서 실제 움직임 또는 조절 행동이 있었는지를 연결률로 봅니다.</text>
  <text x="180" y="1152" class="small">핵심 산식: 연결된 행동 수 ÷ 유효 기회 수 × 100 · 단, 최소 기회 수와 행동 인정 window를 사전 Rule로 정의해야 함</text>
  <line x1="105" y1="1190" x2="1495" y2="1190" stroke="#E6EAF2"/>

  <!-- I3 row -->
  <circle cx="130" cy="1265" r="28" fill="#7C5CFC"/><text x="130" y="1272" text-anchor="middle" class="pill" fill="#FFF">I3</text>
  <text x="180" y="1255" class="t3">일상안정 · 최근 흐름</text>
  <text x="180" y="1287" class="body">I2의 파생값만 재사용하지 않고, 수면·활동·심박 등 생활 신호의 최근 흐름을 개인의 평소 기준과 직접 비교하는 독립 지표로 설계합니다.</text>
  <text x="180" y="1322" class="small">권장 구조: 최근 7일 생활 신호 vs 개인 기준 구간 · 체중/심박은 보조 추세로 사용하고, 의료적 상태 판정에는 사용하지 않음</text>


  <!-- Display policy -->
  <rect x="70" y="1390" width="1460" height="900" rx="28" class="card"/>
  <text x="105" y="1442" class="t2">3. 결과 구간 · 배지 · 변화 · 주간 그래프 정책</text>
  <text x="105" y="1478" class="body">내부 0~100 값은 계산과 구간 판정에만 사용하고, 사용자에게는 상태 라벨과 흐름 중심으로 전달합니다.</text>

  <!-- 3.1 -->
  <text x="105" y="1532" class="t3">3.1 지표별 구간과 라벨</text>
  <text x="105" y="1563" class="small">세 지표 모두 값이 높을수록 긍정적 상태이며, 좋음 · 보통 · 주의 3구간으로 구분합니다. 경계는 잠정 기준입니다.</text>

  <rect x="105" y="1590" width="1390" height="46" rx="10" fill="#EEF2F8"/>
  <text x="130" y="1620" class="tiny">지표</text><text x="390" y="1620" class="tiny">좋음</text><text x="665" y="1620" class="tiny">보통</text><text x="940" y="1620" class="tiny">주의</text><text x="1215" y="1620" class="tiny">경계(잠정)</text>

  <rect x="105" y="1644" width="1390" height="56" rx="10" fill="#F8FBF9"/>
  <text x="130" y="1679" class="t3">생활여유</text><text x="390" y="1679" class="body">충분해요</text><text x="665" y="1679" class="body">보통이에요</text><text x="940" y="1679" class="body">부족해요</text><text x="1215" y="1679" class="small">≥66 / 33~65 / &lt;33</text>

  <rect x="105" y="1706" width="1390" height="56" rx="10" fill="#FFFBF3"/>
  <text x="130" y="1741" class="t3">자기돌봄</text><text x="390" y="1741" class="body">잘하고 있어요</text><text x="665" y="1741" class="body">보통이에요</text><text x="940" y="1741" class="body">돌봄이 필요해요</text><text x="1215" y="1741" class="small">≥66 / 33~65 / &lt;33</text>

  <rect x="105" y="1768" width="1390" height="56" rx="10" fill="#FAF8FF"/>
  <text x="130" y="1803" class="t3">일상안정</text><text x="390" y="1803" class="body">안정적이에요</text><text x="665" y="1803" class="body">비슷하게 이어지고 있어요</text><text x="940" y="1803" class="body">평소와 다른 흐름이에요</text><text x="1215" y="1803" class="small">≥66 / 33~65 / &lt;33</text>

  <!-- 3.2 + 3.3 -->
  <rect x="105" y="1850" width="670" height="190" rx="18" fill="#F8FAFE" stroke="#E6EAF2"/>
  <text x="130" y="1885" class="t3">3.2 구간 배지</text>
  <text x="130" y="1920" class="body">카드 우측 상단에는 선택일의 상태 라벨만 표시</text>
  <text x="130" y="1953" class="small">숫자 · 퍼센트 · 소수점 · 등급은 노출하지 않음</text>
  <text x="130" y="1985" class="small">좋음 = 지표 고유색 · 보통 = 회색 · 주의 = amber</text>
  <text x="130" y="2015" class="small">그래프 선/점은 상태와 무관하게 지표 고유색 유지</text>

  <rect x="825" y="1850" width="670" height="190" rx="18" fill="#F8FAFE" stroke="#E6EAF2"/>
  <text x="850" y="1885" class="t3">3.3 전일 대비 표시</text>
  <text x="850" y="1920" class="body">구간이 달라진 경우에만 지표명 옆에 표시</text>
  <text x="850" y="1953" class="small">주의→보통 / 보통→좋음 / 주의→좋음 : ▲ 좋아졌어요</text>
  <text x="850" y="1985" class="small">좋음→보통 / 보통→주의 / 좋음→주의 : ▼ 낮아졌어요</text>
  <text x="850" y="2015" class="small">동일 구간 또는 전일 값 없음 : 표시하지 않음</text>

  <!-- 3.4 graph -->
  <text x="105" y="2085" class="t3">3.4 주간 그래프 규칙</text>
  <text x="105" y="2116" class="small">숫자를 읽는 그래프가 아니라, 이번 주 값이 어떤 상태 구간 안에서 어떻게 움직였는지 이해하는 그래프입니다.</text>

  <rect x="105" y="2140" width="820" height="115" rx="16" fill="#FBFCFE" stroke="#E6EAF2"/>
  <rect x="125" y="2157" width="780" height="26" rx="8" fill="#EAF8EF"/><text x="842" y="2176" class="tiny" fill="#12A150">좋음</text>
  <rect x="125" y="2183" width="780" height="26" rx="0" fill="#F0F2F5"/><text x="842" y="2202" class="tiny">보통</text>
  <rect x="125" y="2209" width="780" height="26" rx="8" fill="#FFF4E3"/><text x="842" y="2228" class="tiny" fill="#D98A12">주의</text>
  <polyline points="165,2219 275,2203 385,2197 495,2188" fill="none" stroke="#12A150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="605,2189 715,2173 825,2168" fill="none" stroke="#12A150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="165" cy="2219" r="6" fill="#12A150"/><circle cx="275" cy="2203" r="6" fill="#12A150"/><circle cx="385" cy="2197" r="6" fill="#12A150"/><circle cx="495" cy="2188" r="6" fill="#12A150"/>
  <circle cx="605" cy="2189" r="6" fill="#12A150"/><circle cx="715" cy="2173" r="6" fill="#12A150"/><circle cx="825" cy="2168" r="9" fill="#FFF" stroke="#12A150" stroke-width="4"/>
  <text x="165" y="2250" text-anchor="middle" class="tiny">월</text><text x="275" y="2250" text-anchor="middle" class="tiny">화</text><text x="385" y="2250" text-anchor="middle" class="tiny">수</text><text x="495" y="2250" text-anchor="middle" class="tiny">목</text><text x="605" y="2250" text-anchor="middle" class="tiny">금</text><text x="715" y="2250" text-anchor="middle" class="tiny">토</text><text x="825" y="2250" text-anchor="middle" class="tiny" fill="#1A2233">일</text>

  <text x="970" y="2168" class="small">• 월~일 7칸, 실제 값이 있는 날만 점 표시</text>
  <text x="970" y="2196" class="small">• y축 눈금·숫자·점 위 값은 숨김</text>
  <text x="970" y="2224" class="small">• 선택일은 속 빈 원 + 굵은 테두리</text>
  <text x="970" y="2252" class="small">• 결측일은 점 없이 선을 끊고, 미래일은 비움</text>

  <!-- Common policy -->
  <rect x="70" y="2325" width="1460" height="430" rx="28" class="card"/>
  <text x="105" y="2377" class="t2">4. 공통 정책</text>

  <rect x="105" y="2415" width="670" height="130" rx="18" fill="#F8FAFE" stroke="#E6EAF2"/>
  <text x="130" y="2450" class="t3">① 질문 응답은 ‘해석 보조’</text>
  <text x="130" y="2483" class="body">주관 응답이 점수를 직접 올리거나 내리지 않도록 분리합니다.</text>
  <text x="130" y="2513" class="small">용도: 이유 설명 · 코칭 문구 선택 · 신뢰도 보강</text>

  <rect x="825" y="2415" width="670" height="130" rx="18" fill="#F8FAFE" stroke="#E6EAF2"/>
  <text x="850" y="2450" class="t3">② 정확한 점수보다 상태와 흐름</text>
  <text x="850" y="2483" class="body">숫자는 내부 계산용으로 유지하되 화면은 구간과 변화 방향 중심으로 구성합니다.</text>
  <text x="850" y="2513" class="small">0~100 자체를 건강 평가·성과 점수처럼 해석하지 않도록 설계</text>

  <rect x="105" y="2575" width="670" height="130" rx="18" fill="#F8FAFE" stroke="#E6EAF2"/>
  <text x="130" y="2610" class="t3">③ 결측과 0을 구분</text>
  <text x="130" y="2643" class="body">미착용·미수집은 0점이나 주의 상태가 아니라 null로 처리합니다.</text>
  <text x="130" y="2673" class="small">산출 불가 시 ‘데이터가 부족해요’ 등 별도 상태 사용</text>

  <rect x="825" y="2575" width="670" height="130" rx="18" fill="#F8FAFE" stroke="#E6EAF2"/>
  <text x="850" y="2610" class="t3">④ 플랫폼 차이는 비교 가능성부터 판단</text>
  <text x="850" y="2643" class="body">Apple·Samsung의 수집 방식이 다르면 동일 눈금으로 단순 비교하지 않습니다.</text>
  <text x="850" y="2673" class="small">공통 normalized field + coverage/comparable flag 적용</text>

  <!-- Rule table -->
  <rect x="70" y="2790" width="1460" height="330" rx="28" class="card"/>
  <text x="105" y="2842" class="t2">5. 개발 전 반드시 확정할 Rule</text>

  <rect x="105" y="2875" width="1390" height="48" rx="12" fill="#EAF0FF"/>
  <text x="125" y="2906" class="rule">I1</text><text x="220" y="2906" class="body">M/G/H/D 산출 기준 · 활동 몰림/비활동/수면부족 임계값</text>

  <rect x="105" y="2933" width="1390" height="48" rx="12" fill="#FFF4E3"/>
  <text x="125" y="2964" class="rule">I2</text><text x="220" y="2964" class="body">기준점 종류 · 행동 인정 시간창 · 행동 인정 기준 · 최소 기회 수 · 중복 인정 여부</text>

  <rect x="105" y="2991" width="1390" height="48" rx="12" fill="#F1ECFF"/>
  <text x="125" y="3022" class="rule">I3</text><text x="220" y="3022" class="body">개인 baseline 기간 · recent 기간 · 사용할 생활 신호 · 최소 데이터 coverage</text>

  <rect x="105" y="3049" width="1390" height="48" rx="12" fill="#F8FAFE"/>
  <text x="125" y="3080" class="rule">공통</text><text x="220" y="3080" class="body">3구간 경계값 검증 · 상태 라벨 최종 문구 · 전일 대비/그래프 노출 조건 QA</text>

  <!-- Footer -->
  <text x="800" y="3205" text-anchor="middle" class="tiny">maiReport v2 · 생활 지표 최종 기획안 · 2026-09-16</text>
</svg>
