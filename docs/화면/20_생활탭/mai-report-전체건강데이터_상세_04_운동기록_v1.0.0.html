<style id="design2">
:root{--bg:#fbfbfd;--card:#fff;--ink:#0f1222;--mute:#5d6275;--line:#e3e6ef;--chip:#eef1ff;--blue:#5170FF}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Noto Sans KR",system-ui,sans-serif;font-size:14.5px;line-height:1.7;word-break:keep-all}
main{max-width:1400px;margin:0 auto;padding:36px 24px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:4px}
header h1{margin:0;font-family:"DM Serif Display","Noto Sans KR",serif;font-weight:400;font-size:32px;line-height:1.15;letter-spacing:-.01em}
.kind{display:block;width:100%;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 20px;color:var(--mute);font-size:13px;margin:12px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.meta span{display:block}.meta b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--mute)}
.tools button{font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.tools button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet{background:#fff;border:1px solid var(--line);padding:16px;overflow:auto}
.sheet svg{display:block;max-width:100%;height:auto}
.sheet.actual svg{max-width:none}
footer{color:var(--mute);font-size:12.5px;margin-top:22px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
