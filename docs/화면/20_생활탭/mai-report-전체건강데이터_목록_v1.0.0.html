<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--chip:#eef1f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.55}
main{max-width:1400px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px}
header h1{margin:0;font-size:22px}
.kind{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin:4px 0 16px}
.meta b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--mute)}
.tools button{font:inherit;padding:4px 10px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;color:var(--ink)}
.tools button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:auto}
.sheet svg{display:block;max-width:100%;height:auto}
.sheet.actual svg{max-width:none}
footer{color:var(--mute);font-size:12px;margin-top:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#1d2127;--ink:#e6e9ee;--mute:#9aa4b2;--line:#2b313a;--chip:#2a3038}}
:root[data-theme="dark"]{--bg:#15181d;--card:#1d2127;--ink:#e6e9ee;--mute:#9aa4b2;--line:#2b313a;--chip:#2a3038}
</style>
