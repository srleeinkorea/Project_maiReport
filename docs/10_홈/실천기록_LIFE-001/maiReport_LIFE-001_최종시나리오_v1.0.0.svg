    <text x="242" y="80" font-size="9.5" font-weight="800" fill="#6B72D8">수면</text>
    <text x="242" y="96" font-size="10" fill="#16202F">23시 30분 눕기</text>

    <rect x="14" y="148" width="326" height="136" rx="14" fill="#FFFFFF"/>
    <text x="30" y="172" font-size="13.5" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
