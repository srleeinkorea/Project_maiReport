<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="828" viewBox="0 0 1240 828" font-family="Noto Sans KR, Malgun Gothic, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA7BA"/>
    </marker>
  </defs>
  <rect width="1240" height="828" fill="#EFF2F7"/>

  <text x="40" y="36" font-size="18" font-weight="900" letter-spacing="-0.8" fill="#0F1826">maiReport · LIFE-001 목표 이어가기 — 최종 시나리오</text>
  <text x="40" y="56" font-size="12" fill="#6C7A8E">목표가 생성된 날만 완료할 수 있고, 완료한 날만 연속이 이어진다 · 건너뛰기 없음</text>

  <!-- ================= 흐름 ================= -->
