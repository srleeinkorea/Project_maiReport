    <rect x="334" y="96" width="158" height="40" rx="11" fill="#FFFFFF" stroke="#C3CEDD"/>
    <text x="413" y="115" fill="#1B2739" text-anchor="middle">기기 데이터로</text>
    <text x="413" y="130" fill="#1B2739" text-anchor="middle">목표를 만들 수 있나</text>

    <rect x="520" y="96" width="140" height="40" rx="11" fill="#FFFFFF" stroke="#C3CEDD"/>
