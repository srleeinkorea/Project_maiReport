    <text x="318" y="112" text-anchor="middle">예</text>
    <text x="504" y="112" text-anchor="middle">아니오</text>
    <text x="672" y="112" text-anchor="middle">예</text>
    <text x="968" y="112" text-anchor="middle">예</text>
    <text x="254" y="160" fill="#B23A3A" font-weight="700">아니오</text>
    <text x="603" y="160" fill="#B23A3A" font-weight="700">아니오</text>
    <text x="909" y="160" fill="#B23A3A" font-weight="700">아니오</text>
  </g>

  <!-- 결과 -->
  <g font-size="11">
    <rect x="150" y="176" width="184" height="56" rx="11" fill="#FAE9E9"/>
    <text x="166" y="198" font-weight="800" fill="#B23A3A">끊김 · 목표 없음</text>
    <text x="166" y="216" fill="#8A5252">접속 안 함 — 미기록과 같다</text>

    <rect x="498" y="176" width="184" height="56" rx="11" fill="#FAE9E9"/>
    <text x="514" y="198" font-weight="800" fill="#B23A3A">끊김 · 목표 없음</text>
    <text x="514" y="216" fill="#8A5252">답할 기회를 쓰지 않았다</text>

    <rect x="804" y="176" width="184" height="56" rx="11" fill="#FAE9E9"/>
    <text x="820" y="198" font-weight="800" fill="#B23A3A">끊김</text>
    <text x="820" y="216" fill="#8A5252">목표는 있었으나 미완료</text>
  </g>
  <text x="40" y="256" font-size="11.5" fill="#6C7A8E">세 갈래 모두 <tspan font-weight="700" fill="#B23A3A">끊김</tspan>이다 — 건너뛰는 경우는 없다.
    목표가 생성된 날만 완료할 수 있고, 완료한 날만 이어진다.</text>

