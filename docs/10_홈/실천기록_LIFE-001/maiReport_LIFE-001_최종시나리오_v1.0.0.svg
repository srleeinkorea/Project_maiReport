    <rect y="12" width="354" height="286" rx="17" fill="#F4F6FA" stroke="#DFE4EC"/>
    <rect x="14" y="26" width="326" height="112" rx="14" fill="#FFFFFF"/>
    <text x="30" y="50" font-size="13.5" font-weight="900" letter-spacing="-0.5" fill="#16202F">오늘의 목표</text>
    <text x="324" y="50" font-size="10" fill="#7A879A" text-anchor="end">1/3 완료</text>
    <rect x="30" y="62" width="92" height="62" rx="11" fill="#FCEBD8"/>
    <text x="40" y="80" font-size="9.5" font-weight="800" fill="#B4611F">식이</text>
