    <rect y="12" width="354" height="286" rx="17" fill="#F4F6FA" stroke="#DFE4EC"/>
    <rect x="14" y="26" width="326" height="112" rx="14" fill="#FFFFFF"/>
    <text x="30" y="50" font-size="13.5" font-weight="900" letter-spacing="-0.5" fill="#16202F">오늘의 목표</text>
    <rect x="30" y="62" width="294" height="62" rx="11" fill="#EDF3FF" stroke="#CFDEFF"/>
    <text x="44" y="82" font-size="9.5" font-weight="800" fill="#2F6BFF">오늘 목표를 받으려면</text>
    <text x="44" y="100" font-size="11" fill="#3C4460">몇 가지만 답하면 만들어 드려요.</text>
    <rect x="226" y="96" width="84" height="20" rx="10" fill="#2F6BFF"/>
    <text x="268" y="110" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">질문에 답하기</text>

    <rect x="14" y="148" width="326" height="136" rx="14" fill="#FFFFFF"/>
    <text x="30" y="172" font-size="13.5" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="30" y="182" width="92" height="58" rx="11" fill="#FCEBD8"/>
    <text x="76" y="200" font-size="9.5" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="76" y="222" font-size="15" font-weight="900" fill="#16202F" text-anchor="middle">3<tspan font-size="9.5">일 연속</tspan></text>
    <rect x="131" y="182" width="92" height="58" rx="11" fill="#FBDDE6"/>
    <text x="177" y="200" font-size="9.5" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="177" y="222" font-size="15" font-weight="900" fill="#16202F" text-anchor="middle">6<tspan font-size="9.5">일 연속</tspan></text>
    <rect x="232" y="182" width="92" height="58" rx="11" fill="#DFE2FA"/>
    <text x="278" y="200" font-size="9.5" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="278" y="222" font-size="15" font-weight="900" fill="#16202F" text-anchor="middle">14<tspan font-size="9.5">일 연속</tspan></text>
    <rect x="30" y="248" width="294" height="26" rx="9" fill="#ECF1F7"/>
    <text x="44" y="265" font-size="10.5" fill="#3C4460">수면 목표를 14일 연속 완료했어요.</text>
  </g>

  <g transform="translate(820,292)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#6C7A8E">목표가 없는 날 — <tspan fill="#8D99AB">과거</tspan></text>
    <rect y="12" width="354" height="286" rx="17" fill="#F4F6FA" stroke="#DFE4EC"/>
    <rect x="14" y="26" width="326" height="112" rx="14" fill="#FFFFFF"/>
    <text x="30" y="50" font-size="13.5" font-weight="900" letter-spacing="-0.5" fill="#16202F">8월 14일 목표</text>
    <rect x="30" y="62" width="294" height="62" rx="11" fill="#F2F5FA"/>
    <text x="44" y="82" font-size="9.5" font-weight="800" fill="#5E6C82">이 날은 목표가 없었어요</text>
    <text x="44" y="100" font-size="11" fill="#3C4460">질문에 답하지 않아 만들지 못했어요.</text>
    <text x="44" y="116" font-size="9.5" fill="#95A0B0">지금은 되돌릴 수 없어요 · 버튼 없음</text>

    <rect x="14" y="148" width="326" height="136" rx="14" fill="#FFFFFF"/>
    <text x="30" y="172" font-size="13.5" font-weight="900" letter-spacing="-0.5" fill="#16202F">목표 이어가기</text>
    <rect x="30" y="182" width="92" height="58" rx="11" fill="#FCEBD8"/>
    <text x="76" y="200" font-size="9.5" font-weight="800" fill="#B4611F" text-anchor="middle">식이</text>
    <text x="76" y="220" font-size="11.5" font-weight="900" fill="#66748A" text-anchor="middle">다시 시작</text>
    <rect x="131" y="182" width="92" height="58" rx="11" fill="#FBDDE6"/>
    <text x="177" y="200" font-size="9.5" font-weight="800" fill="#B93E5F" text-anchor="middle">활동</text>
    <text x="177" y="222" font-size="15" font-weight="900" fill="#16202F" text-anchor="middle">3<tspan font-size="9.5">일 연속</tspan></text>
    <text x="177" y="236" font-size="8.5" font-weight="800" fill="#1C7A57" text-anchor="middle">8월 14일까지</text>
    <rect x="232" y="182" width="92" height="58" rx="11" fill="#DFE2FA"/>
    <text x="278" y="200" font-size="9.5" font-weight="800" fill="#4A51BC" text-anchor="middle">수면</text>
    <text x="278" y="222" font-size="15" font-weight="900" fill="#16202F" text-anchor="middle">6<tspan font-size="9.5">일 연속</tspan></text>
    <text x="278" y="236" font-size="8.5" font-weight="800" fill="#1C7A57" text-anchor="middle">8월 14일까지</text>
    <rect x="30" y="248" width="294" height="26" rx="9" fill="#ECF1F7"/>
    <text x="44" y="265" font-size="10.5" fill="#3C4460">8월 14일 기준 기록이에요.</text>
  </g>

  <!-- ================= 정리 ================= -->
  <g transform="translate(40,616)">
    <rect width="1134" height="178" rx="15" fill="#FFFFFF" stroke="#DCE3ED"/>

    <text x="24" y="30" font-size="12.5" font-weight="800" fill="#101A2B">과거에는 질문 유도를 하지 않는다</text>
    <text x="24" y="52" font-size="11.5" fill="#4B586C">지난 날의 컨디션을 지금 답할 수 없고, 사후에 목표를 만들어 체크하면
      <tspan font-weight="700" fill="#1B2739">끊긴 연속을 되살릴 수 있게 된다</tspan> — 기록이 아니라 편집이 된다.</text>
    <text x="24" y="71" font-size="11.5" fill="#4B586C">그래서 <tspan font-weight="700" fill="#1B2739">과거 완료 기록은 그날 목표가 생성돼 있던 날만</tspan> 허용한다.
      목표가 있었다는 건 그날 접속해서 조건을 채웠다는 뜻이다.</text>

    <rect x="24" y="90" width="1086" height="1" fill="#E4EAF2"/>

    <text x="24" y="116" font-size="12.5" font-weight="800" fill="#1C7A57">타일은 목표 유무와 무관하다</text>
    <text x="24" y="137" font-size="11.5" fill="#4B586C">타일은 <tspan font-weight="700" fill="#1B2739">완료 이력</tspan>으로 계산하고 읽기 전용이다.
      목표가 없는 날에도 어제까지의 일수가 그대로 뜬다 — 회색 「—」로 비우지 않는다.</text>
    <text x="24" y="162" font-size="11.5" fill="#4B586C"><tspan font-weight="800" fill="#101A2B">저장 구조</tspan>
      <tspan font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#2F6BFF">  goal_record (user_id, category, record_date, is_done, done_at, goal_text)</tspan>
      — 행이 있으면 그날 목표가 있었던 것 · 생성 사유 · 방문 기록 · 건너뛰기 상한 모두 불필요</text>
  </g>
</svg>
