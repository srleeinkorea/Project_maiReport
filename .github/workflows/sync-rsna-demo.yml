name: RSNA 시연 사이트 동기화

# outputs/mai-report-rsna-demo 의 급성폐렴 시연 HTML을
# srleeinkorea/maireport-rsna-demo-k7x9m2q8v4n6 의 original.html 로 복사한다.
# 사이트에서는 https://srleeinkorea.github.io/maireport-rsna-demo-k7x9m2q8v4n6/#original 로 열린다.
# 필요: 저장소 Secret DEMO_REPO_TOKEN (시연 저장소 Contents: Read and write 권한의 fine-grained 토큰)

on:
  push:
    branches: [main]
    paths:
      - 'outputs/mai-report-rsna-demo/*.html'
      - '.github/workflows/sync-rsna-demo.yml'
  workflow_dispatch:

concurrency:
  group: sync-rsna-demo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/checkout@v4
        with:
          repository: srleeinkorea/maireport-rsna-demo-k7x9m2q8v4n6
          ref: main
          token: ${{ secrets.DEMO_REPO_TOKEN }}
          path: site

      - name: 최신 시연 HTML 복사
        run: |
          f=$(ls src/outputs/mai-report-rsna-demo/*.html | sort -V | tail -n1)
          echo "원본: $f"
          cp "$f" site/original.html

      - name: 바뀐 것이 있으면 커밋·푸시
        working-directory: site
        run: |
          git add original.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git commit -m "RSNA 급성폐렴 시연 동기화 (${GITHUB_SHA::7})"
          git push origin HEAD:main
